        // 魔法变种类型 → 基础生物(给新生物加魔法变种时在这里登记一行)
        const MAGIC_KINDS = { magic: 'normal', magicBubble: 'bubble' };
        // ===== 机械花的"花瓣"：身边那圈齿轮。规则与玩家的花瓣一致 =====
        // 围着本体转(一顿一顿)、是实体、能被玩家花瓣打碎、碎了要等加载(冷却)、碰到玩家才造成伤害
        const MECH_GEAR_COUNT = 6;        // 齿轮数量
        const MECH_GEAR_ORBIT = 1.15;     // 轨道半径 = 本体半径 × 这个
        const MECH_GEAR_SIZE = 0.22;      // 齿轮半径 = 本体半径 × 这个
        const MECH_GEAR_HP_RATIO = 0.08;  // 单个齿轮血量 = 本体最大血量 × 这个
        const MECH_GEAR_CD = 6;           // 齿轮被打碎后重新加载的秒数
        const MECH_GEAR_MAX_PUSH = 40;    // 齿轮被撞开的位移上限
        function mechGearRadius(m){ return Math.max(3, (m.radius||0) * MECH_GEAR_SIZE); }
        function initMechGears(m){
            m.gears = [];
            const hp = Math.max(1, m.maxHp * MECH_GEAR_HP_RATIO);
            for(let i=0;i<MECH_GEAR_COUNT;i++) m.gears.push({ i:i, hp:hp, maxHp:hp, alive:true, cd:0, ox:0, oy:0 });
        }
        function refreshMechGearHp(m){
            if(!m.gears) return;
            const hp = Math.max(1, m.maxHp * MECH_GEAR_HP_RATIO);
            for(const g of m.gears){ g.maxHp = hp; if(g.hp > hp) g.hp = hp; }
        }
        // 齿轮的世界坐标：绕本体一顿一顿地转 + 被撞开的偏移
        function mechGearPos(m, g){
            // 只按齿轮圈自己的"一顿一顿"自转定位；不叠加本体朝向，
            // 否则本体一转、整圈齿轮会瞬移 47px(玩家会觉得齿轮在跳)
            const a = g.i * (Math.PI*2/MECH_GEAR_COUNT) + (m.gearAng||0);
            const R = (m.radius||0) * MECH_GEAR_ORBIT;
            return { x: m.x + Math.cos(a)*R + (g.ox||0), y: m.y + Math.sin(a)*R + (g.oy||0), angle:a, r:mechGearRadius(m) };
        }
        function pushMechGear(g, dx, dy){
            g.ox = (g.ox||0) + dx; g.oy = (g.oy||0) + dy;
            const d = Math.hypot(g.ox, g.oy);
            if(d > MECH_GEAR_MAX_PUSH){ const k = MECH_GEAR_MAX_PUSH/d; g.ox *= k; g.oy *= k; }
        }
        // 齿轮受伤(玩家花瓣打上来时调用)：打碎后进入加载冷却
        function damageMechGear(m, g, dmg, hx, hy){
            if(!g || !g.alive) return false;
            g.hp -= dmg;
            const p = mechGearPos(m, g);
            if(hx !== undefined && hy !== undefined) pushMechGear(g, p.x - hx, p.y - hy);
            if(g.hp <= 0){ g.hp = 0; g.alive = false; g.cd = MECH_GEAR_CD; spawnParticles(p.x, p.y, '#90a4ae', 10); return true; }
            return false;
        }
        function updateMechflower(m, dt, px, py){
            // 旋转逻辑与效果和玩家一致：同一套"转速 + 一顿一顿"步进(见 mechRingDelta)
            m.gearAng = (m.gearAng || 0) + mechRingDelta(m, dt);
            m.pushVX *= Math.exp(-6*dt); m.pushVY *= Math.exp(-6*dt);
            const dx = px - m.x, dy = py - m.y, dist = Math.hypot(dx,dy) || 1;
            const ang = Math.atan2(dy, dx);
            m.angle = ang;      // 本体朝玩家，齿轮圈随之扫过
            // 保持"齿轮刚好够到玩家"的距离：太远靠近、太近退开(本体不再撞人，靠齿轮打)
            const reach = (m.radius||0)*MECH_GEAR_ORBIT + mechGearRadius(m) + getPlayerRadius();
            const speed = 40 + (m.radius||0)*0.4;
            let mvx = 0, mvy = 0;
            if(!playerDead && dist > reach) { mvx = Math.cos(ang)*speed; mvy = Math.sin(ang)*speed; }
            else if(!playerDead && dist < reach*0.7) { mvx = -Math.cos(ang)*speed*0.7; mvy = -Math.sin(ang)*speed*0.7; }
            monsterMoveBy(m, (mvx + m.pushVX)*dt, (mvy + m.pushVY)*dt);
            for(const g of m.gears){
                if(!g.alive){
                    g.cd -= dt;
                    if(g.cd <= 0){ g.alive = true; g.hp = g.maxHp; g.ox = 0; g.oy = 0; }
                    continue;
                }
                const rel = Math.exp(-5*dt); g.ox *= rel; g.oy *= rel;   // 被撞开后慢慢回到轨道
                const p = mechGearPos(m, g);
                // 齿轮碰到玩家的伤害已移到固定的碰撞 tick 里统一结算(applyPlayerContactDamage)
            }
            refreshMechGearHp(m);
        }
        function drawMechGears(m, s, r){
            if(!m.gears) return;
            const gr = mechGearRadius(m) * (r / Math.max(1, m.radius||1));   // 按实际绘制半径缩放
            for(const g of m.gears){
                const a = (m.angle||0) + g.i*(Math.PI*2/MECH_GEAR_COUNT) + (m.gearAng||0);
                const R = r * MECH_GEAR_ORBIT;
                const gx = s.x + Math.cos(a)*R + (g.ox||0), gy = s.y + Math.sin(a)*R + (g.oy||0);
                if(!g.alive){   // 碎了：留一个虚位，等加载
                    ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI*2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5; ctx.stroke();
                    continue;
                }
                ctx.beginPath(); ctx.arc(gx, gy, gr, 0, Math.PI*2);
                ctx.fillStyle = '#607d8b'; ctx.fill();
                ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.stroke();
            }
        }
        // 机械花本体：正16边形(16个顶点等距、等夹角)
        function mechflowerVertices(cx, cy, r, rot){
            const pts = [];
            for (let i = 0; i < 16; i++){
                const a = i * (Math.PI * 2 / 16) - Math.PI / 2 + (rot || 0) * 0.1;
                pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
            }
            return pts;
        }
        // 通用圆形生物绘制(新生物先用代码画，等贴图替换)
        // 生物朝向：跟着自己的移动方向转(速度太小时按"被推动"的方向；基本没动就保持上一次朝向，免得抖)
        // 玩家受到的接触伤害：统一放进固定 75 次/秒的碰撞 tick 里结算(和花瓣伤害同一套节奏，与帧率无关)
        function applyPlayerContactDamage(){
            for (const m of monsters){
                if (!m.alive) continue;
                // 机械花：本体不造成伤害，靠身边那圈齿轮打
                if (m.type === 'mechflower' && m.gears){
                    for (const g of m.gears){
                        if (!g.alive) continue;
                        const gp = mechGearPos(m, g);
                        if (Math.hypot(gp.x - playerX, gp.y - playerY) < gp.r + getPlayerRadius()){
                            playerTakeDamage(m.dmg * CONTACT_DMG_PER_TICK, '机械花·齿轮');   // 每个碰撞 tick 连续结算
                            m.lastDmgTime = gameTime;
                        }
                    }
                    continue;
                }
                if (!m.def || !m.def.contactDmg) continue;   // 灌木丛/海绵/病毒/黑洞等不造成接触伤害
                const dist = Math.hypot(playerX - m.x, playerY - m.y);
                if (dist < getPlayerRadius() + m.radius){
                    playerTakeDamage(m.dmg * CONTACT_DMG_PER_TICK, m.name || '怪物');   // 每个碰撞 tick 连续结算
                    m.lastDmgTime = gameTime;
                }
            }
        }
        function monsterFaceHeading(m){
            let ax = m.vx || 0, ay = m.vy || 0;
            if (Math.hypot(ax, ay) < 4){ ax = m.pushVX || 0; ay = m.pushVY || 0; }
            if (Math.hypot(ax, ay) < 4) return;
            m.angle = Math.atan2(ay, ax);
        }
        function drawCreatureCircle(m, s, r, ds, col){
            // 有贴图就用贴图(内容缩放到碰撞半径 r → 外观与碰撞箱一致)，没有就退回原来的圆形绘制
            const texId = m.baseType || m.type;
            const texInfo = texDef('mob', texId);
            // texInfo[5]=1 的怪(虫子类)会转向自己的移动方向；其它的(灌木丛/海绵/泡泡/假人)保持不转
            const texRot = (texInfo && texInfo[5]) ? (m.angle || 0) : 0;
            const tr = mobDrawRadius(texId, r);   // 带腿/触角的虫子贴图会伸出碰撞箱
            if (drawMobSprite(m, texId, s, r, texRot)) {
                if (ds.flash > 0) { ctx.globalAlpha = ds.flash; ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(s.x, s.y, tr, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = ds.alpha; }
                if (!m.alive) { ctx.globalAlpha = 1; return; }
                drawMonsterBar(m, s, texBarOffset('mob', texId, tr, texRot) + 5);
                return;
            }
            ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2);
            ctx.fillStyle = m.variant ? '#7a8fd0' : col; ctx.fill();
            ctx.strokeStyle = getRarityColor(m.rarity); ctx.lineWidth = (m.rarity === 11 ? 4 : 2); ctx.stroke();
            if (ds.flash > 0) { ctx.globalAlpha = ds.flash; ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = ds.alpha; }
            if (!m.alive) { ctx.globalAlpha = 1; return; }
            drawMonsterBar(m, s, r + 6);
        }
        function equipHasType(t){ for (let i = 0; i < playerSlots; i++) { const s = equippedSlots[i]; if (s && s.type === t) return true; } return false; }
        // 暗物质占用槽位数：普通5 / 传奇100 / 唯一2048
        function darkMatterOrbitSpan(rarity){ return rarity >= 11 ? 2048 : (rarity >= 5 ? 100 : 5); }   // 占用轨道位置数
        // 统一的怪物血条 + 等级名称(所有生物共用)
        function drawMonsterBar(m, s, dy){
            if (!m.alive) return;
            const barW = 40, barH = 4, barX = s.x - barW/2, barY = s.y + dy;
            ctx.fillStyle = '#fff'; ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'center';
            ctx.fillText(m.name || '', s.x, barY - 3);   // 生物名字(所有生物都显示)
            ctx.fillStyle = '#333'; ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = m.variant ? '#4169E1' : '#4CAF50';
            ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, m.hp/m.maxHp)), barH);
            ctx.fillStyle = getRarityColor(m.rarity); ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'left';
            ctx.fillText(levelNameOf(m.rarity), barX, barY + barH + 10);
        }
        class Monster {
            // 生物数值/行为/绘制全部走 CREATURE_DEFS 表(见下方)，加新生物只需要加一条表项
            constructor(x,y,rarity,kind='normal'){
                this.id = ++entityIdSeq;
                const baseKind = MAGIC_KINDS[kind] || kind;
                const def = CREATURE_DEFS[baseKind] || CREATURE_DEFS.normal;
                this.x=x; this.y=y; this.rarity=rarity; this.kind=kind;
                this.variant = !!MAGIC_KINDS[kind];   // 魔法变种(魔法/魔法泡泡…)
                this.baseType = baseKind;
                this.type = baseKind;
                this.def = def;
                this.name = def.name;
                this.radius = Math.max(def.minRadius || 0, getMonsterRadius(rarity));
                def.stats(this, rarity);                        // 数值全部由生物表决定
                this.vx=0; this.vy=0; this.alive=true; this.pushVX=0; this.pushVY=0;
                this.armor = getMonsterArmor(this.dmg); // 怪物护甲(泡泡等也适用)
                this.wanderAngle=Math.random()*Math.PI*2; this.wanderTimer=0; this.lastDmgTime=0;
                this.angle = this.wanderAngle;   // 初始朝向 = 初始游荡方向
                this.flash = 0; this.flashTime = -99; this.dying = false; this.dieTime = 0;
                if(this.variant){
                    this.variantColor = VARIANT_COLOR;
                    this.variantName = this.baseType==='bubble' ? '魔法泡泡' : '魔法';
                    this.variantLevel = rarity + 1;
                }
                if (def.init) def.init(this, rarity);           // 生物表里的额外初始化
            }
            update(dt, px, py){
                if(this.flash > 0) this.flash = Math.max(0, this.flash - dt / 0.15); // 受击变红衰减
                const def = this.def || CREATURE_DEFS[this.type] || CREATURE_DEFS.normal;
                def.update(this, dt, px, py);   // 行为全部由生物表决定
                // 朝向跟随自己的移动方向；蜜蜂/机械花自己管朝向(keepsOwnAngle)就不覆盖
                if (!def.keepsOwnAngle) monsterFaceHeading(this);
            }
            updateBee(dt, px, py){
                const dx = px - this.x;
                const dy = py - this.y;
                const dist = Math.hypot(dx, dy);
                const angleToPlayer = Math.atan2(dy, dx);
                const aggroR = getMonsterAggro(this);
                let targetAngle = this.angle;
                let speed = 60 + this.radius*0.4;
                this.shootCooldown -= dt;
                this.pushVX *= Math.exp(-6*dt); this.pushVY *= Math.exp(-6*dt);
                switch(this.state){
                    case 'idle':
                        if(dist < aggroR) { this.state = 'chase'; }
                        else {
                            this.angle += (Math.random()-0.5)*2*dt;
                            this.vx = Math.cos(this.angle)*speed*0.3 + this.pushVX;
                            this.vy = Math.sin(this.angle)*speed*0.3 + this.pushVY;
                        }
                        break;
                    case 'chase':
                        targetAngle = angleToPlayer;
                        if(dist > aggroR + 100) { this.state = 'idle'; }
                        else if(dist > this.targetDistance+50){
                            this.vx = Math.cos(targetAngle)*speed + this.pushVX;
                            this.vy = Math.sin(targetAngle)*speed + this.pushVY;
                        }else if(dist < this.targetDistance-50){
                            this.state = 'flee';
                        }else{
                            this.state = 'positioning';
                        }
                        break;
                    case 'flee':
                        targetAngle = angleToPlayer + Math.PI;
                        if(dist > aggroR + 100) { this.state = 'idle'; }
                        else if(dist > this.targetDistance+50){
                            this.state = 'chase';
                        }else if(dist >= this.targetDistance-50 && dist <= this.targetDistance+50){
                            this.state = 'positioning';
                        }else{
                            this.vx = Math.cos(targetAngle)*speed + this.pushVX;
                            this.vy = Math.sin(targetAngle)*speed + this.pushVY;
                        }
                        break;
                    case 'positioning':
                        targetAngle = angleToPlayer;
                        if(dist > aggroR + 100) { this.state = 'idle'; }
                        else if(dist > this.targetDistance+50) this.state = 'chase';
                        else if(dist < this.targetDistance-50) this.state = 'flee';
                        else{
                            this.vx = this.pushVX; this.vy = this.pushVY;
                            if(this.shootCooldown <= 0 && this.missileReady){
                                this.state = 'shoot';
                                this.shootCooldown = 6.0;
                            }
                        }
                        break;
                    case 'shoot':
                        if(!this.missileReady) { this.state = 'positioning'; break; }
                        targetAngle = angleToPlayer + Math.PI;
                        const aDiff = Math.abs(Math.atan2(Math.sin(targetAngle - this.angle), Math.cos(targetAngle - this.angle)));
                        if(aDiff < 0.15){
                            let shootAngle = angleToPlayer;
                            const tailX = this.x - Math.cos(this.angle) * this.radius * 1.2;
                            const tailY = this.y - Math.sin(this.angle) * this.radius * 1.2;
                            beeMissiles.push(new BeeMissile(tailX, tailY, shootAngle, this.rarity));
                            this.missileReady = false;
                            setTimeout(()=>{ this.missileReady = true; }, 1000);
                            if(dist > aggroR + 100) this.state = 'idle';
                            else this.state = 'positioning';
                        }
                        break;
                }
                let angleDiff = Math.atan2(Math.sin(targetAngle - this.angle), Math.cos(targetAngle - this.angle));
                this.angle += angleDiff * 5 * dt;
                monsterMoveBy(this, this.vx * dt, this.vy * dt);
            }
            takeDamage(dmg, sx, sy, srcType){
                const real = applyArmor(dmg, this.armor); // 怪物护甲：硬性减伤
                if (real <= 0) return;
                this.hp -= real;
                // 受伤变红：每 HIT_FLASH_INTERVAL 秒才重新触发一次(连续受击时变成"每0.3秒闪一下"，
                // 而不是每一帧都刷新导致一直红着)；闪的强度按本次伤害占最大血量的比例，越高越红(有上限)
                if (gameTime - (this.flashTime || -99) >= HIT_FLASH_INTERVAL) {
                    this.flashTime = gameTime;
                    this.flash = Math.max(this.flash || 0, Math.min(0.9, real / Math.max(1, this.maxHp) * 4));
                }
                // 花瓣推力：只能推动传奇(5)及以下的怪；"重"(4)与(魔法)泡泡炸弹(11/12)例外，任何等级都能推
                const canPush = (srcType === undefined) || this.rarity <= 5 || srcType === 4 || srcType === 11 || srcType === 12;
                if (canPush) {
                    const angle = Math.atan2(this.y-sy, this.x-sx);
                    this.pushVX += Math.cos(angle) * pushForce;
                    this.pushVY += Math.sin(angle) * pushForce;
                }
                if(this.hp<=0){ this.alive=false; this.onDeath(); }
            }
            onDeath(){
                this.dying = true; this.dieTime = gameTime; // 死亡动画：0.1秒内变大并淡出
                // 掉落：按怪物惯性方向飞出一点，同种同品质附近堆叠
                const fvx = this.pushVX * 0.7, fvy = this.pushVY * 0.7;
                const D = (t, r, c) => addDrop(this.x, this.y, t, r, c || 1, fvx, fvy);
                if (this.rarity >= 10) {
                    // 终末/唯一品质怪物：先掉"自己的物品"(品质=怪物品质)，再额外掉原来的大份奖励。
                    // 以前这里只掉奖励、不掉自己的东西，导致高品级时所有怪的掉落都和生物表对不上。
                    const dropKey10 = (this.def && this.def.dropKey) || this.baseType;
                    const table10 = getDropTableFor(dropKey10);
                    const r10 = Math.min(this.rarity, 10);   // 唯一品质不直接掉唯一花瓣，避免破坏"同种唯一花瓣全图仅1个"
                    if (!this.variant && dropKey10 === 'normal') D(0, r10, 1);
                    else if (table10) for (const t of table10) D(this.variant ? magicVariantOf(t) : t, r10, 1);
                    // 大份奖励：只从"该生物自己能掉的花瓣"里抽(不再发通用花瓣)
                    // 终末：1000× 终极品质 + 1个终末品质；唯一：20000× 终极品质
                    // 额外掉落也只在它自己会掉时才给(例如只有黄金瓢虫会给箭头)
                    const bonusPool = (table10 && table10.length)
                        ? table10.map(t => this.variant ? magicVariantOf(t) : t)
                        : [0];
                    const bonusPick = () => bonusPool[Math.floor(Math.random()*bonusPool.length)];
                    D(bonusPick(), 9, this.rarity === 10 ? 1000 : 20000);
                    if (this.rarity === 10) {
                        D(bonusPick(), this.rarity, 1);
                        if (bonusPool.indexOf(7) >= 0) D(7, this.rarity, 1);   // 箭头(仅本就会掉箭头的生物)
                    }
                } else {
                    // 掉落按生物表 dropKey 走(以后新生物自己指定)
                    const dropKey = (this.def && this.def.dropKey) || this.baseType;
                    // 非魔法的原初怪(任何品质)只掉基本花瓣：以前只有普通品质这样，
                    // 常见~史诗的原初怪会把整张表(基本/叶子/玫瑰/血刺/触角/海绵/箭头)一次掉一地，
                    // 在金框原初怪旁边杀怪时看着就像"别的怪掉了刺"
                    if (!this.variant && dropKey === 'normal') { D(0, this.rarity, 1); }
                    else {
                        // 掉落 = 怪物表里列出的那几种，全都掉(规格里就是按"掉落：A，B"这么写的)
                        const table = getDropTableFor(dropKey);
                        if (table) for (const t of table) D(this.variant ? magicVariantOf(t) : t, this.rarity, 1);
                    }
                }
                playerExp = Math.min(EXP_MAX, playerExp + (this.type==='bubble' ? 2 : 10 * Math.pow(2, this.rarity) * (this.rarity >= 10 ? Math.pow(1000, this.rarity - 9) : 1)));
                checkLevelUp(); spawnParticles(this.x,this.y,this.variant?this.variantColor:getRarityColor(this.rarity),12);
            }
        }

        class TrainingDummy {
            constructor(x, y, rarity) {
                this.id = ++entityIdSeq;
                this.x = x;
                this.y = y;
                this.rarity = rarity;
                this.radius = getMonsterRadius(rarity);
                this.maxHp = monsterBaseHP * rarityMult(rarity);
                if (this.rarity >= 5) this.maxHp *= 4;
                this.hp = this.maxHp;
                this.dmg = 10 * rarityDmgMult(rarity);   // 训练假人伤害同样按唯一x10
                this.alive = true;
                this.vx = 0; this.vy = 0;
                this.totalDamage = 0;
                this.firstHitTime = null;
                this.hitCount = 0;
                this.lastHitTime = 0;
                this.flash = 0;          // 受击变红：0~0.85，约0.2秒淡出
                this.flashTime = -99;    // 上次红闪的时间(每 HIT_FLASH_INTERVAL 秒才再闪一次)
            }
            update(dt, px, py) {
                if (this.flash > 0) this.flash = Math.max(0, this.flash - dt * 5);
                if (this.totalDamage > 0 && gameTime - this.lastHitTime > 15) {
                    this.totalDamage = 0;
                    this.firstHitTime = null;
                    this.hitCount = 0;
                    this.hp = this.maxHp;
                }
            }
            takeDamage(dmg, sx, sy) {
                if (!(dmg > 0)) return;
                // 训练假人：血量打空后依然继续累计总伤害(否则总伤害会卡在它的血量上限上不去了)
                this.hp = Math.max(0, this.hp - dmg);
                // 受伤变红：每 HIT_FLASH_INTERVAL 秒闪一次(和怪物同一套节奏)，伤害越高越红
                if (gameTime - (this.flashTime || -99) >= HIT_FLASH_INTERVAL) {
                    this.flashTime = gameTime;
                    this.flash = Math.max(this.flash || 0, Math.min(0.85, 0.45 + dmg / Math.max(1, this.maxHp) * 4));
                }
                this.totalDamage += dmg;
                this.hitCount++;
                this.lastHitTime = gameTime;
                if (this.firstHitTime === null) this.firstHitTime = gameTime;
            }
            resetStats() {
                this.hp = this.maxHp;
                this.totalDamage = 0;
                this.firstHitTime = null;
                this.hitCount = 0;
                this.lastHitTime = 0;
            }
            getDps() {
                if (this.firstHitTime === null) return 0;
                const elapsed = gameTime - this.firstHitTime;
                if (elapsed <= 0) return 0;
                return this.totalDamage / elapsed;
            }
        }

        class BeeMissile {
            constructor(x, y, angle, rarity){
                this.id = ++entityIdSeq;
                this.x = x; this.y = y; this.angle = angle;
                this.speed = 200; this.rarity = rarity;
                this.radius = MISSILE_BASE_RADIUS * Math.pow(SIZE_MULT, rarity);
                this.hp = 10 * rarityMult(rarity);
                this.dmg = 10 * rarityDmgMult(rarity);   // 训练假人伤害同样按唯一x10
                this.alive = true;
                this.lifetime = MISSILE_LIFETIME;
                this.pushVX = 0; this.pushVY = 0;   // 被泡泡炸弹推开的速度(只改位置，不改朝向)
            }
            update(dt){
                // 被炸开的速度：快速衰减，导弹朝向(angle)与前进方向保持不变
                this.x += Math.cos(this.angle)*this.speed*dt + this.pushVX*dt;
                this.y += Math.sin(this.angle)*this.speed*dt + this.pushVY*dt;
                this.pushVX *= Math.exp(-5*dt); this.pushVY *= Math.exp(-5*dt);
                this.lifetime -= dt;
                if(this.lifetime <= 0 || Math.hypot(this.x-playerX, this.y-playerY)>2500) this.alive = false;
            }
        }

        class Drop {
            constructor(x,y,type,rarity,count=1,vx=0,vy=0){
                this.x=x; this.y=y; this.vx=vx||0; this.vy=vy||0;
                this.type=type; this.rarity=rarity; this.count=count;
                this.lifetime=15; this.radius=8; this.collected=false;
                this.bob=Math.random()*Math.PI*2;
            }
            update(dt){
                this.lifetime-=dt; this.bob+=dt*2.4;
                // 飞出一点后逐渐停下(防止卡片重叠)
                this.x += this.vx*dt; this.y += this.vy*dt;
                this.vx *= Math.exp(-2.5*dt); this.vy *= Math.exp(-2.5*dt);
                if(this.lifetime<=0)this.collected=true;
            }
            getY(){ return this.y+Math.sin(this.bob)*3; }
        }

        // 产生掉落：同种同品质在附近则堆叠数量，否则新建卡片并向随机方向飞出一点
        function addDrop(x,y,type,rarity,count,vx,vy){
            const exist = drops.find(d => !d.collected && d.type===type && d.rarity===rarity && Math.hypot(d.x-x, d.y-y) < 30);
            if(exist){ exist.count += count; return exist; }
            const a = Math.random()*Math.PI*2, sp = 35 + Math.random()*55;
            const d = new Drop(x, y, type, rarity, count, (vx||0) + Math.cos(a)*sp, (vy||0) + Math.sin(a)*sp);
            drops.push(d);
            return d;
        }

        // 终极(9)以上花瓣装备时一直散出的粒子：颜色按品质(终极白 / 终末紫 / 唯一黑)，
        // 画在花瓣"下面"、其它东西"上面"(见 render 里的 petalGlow 那一段)。
        let petalGlow = [];
        function glowColorOf(rarity){
            if (rarity >= 11) return '#000000';   // 唯一：黑色
            if (rarity >= 10) return '#CC33FF';   // 终末：紫色
            return '#FFFFFF';                     // 终极：白色
        }
        function petalVisible(s){ return s && s.petalInstance && s.petalInstance.alive && !(s.petalInstance.state === 'cooldown' && !s.petalInstance.roseActive); }
        function updatePetalGlow(dt){
            const baseAngle = getPetalBase();
            for (let i=0;i<playerSlots;i++){
                const s = equippedSlots[i];
                if (!s || s.rarity < 9 || !petalVisible(s)) continue;
                s._glowT = (s._glowT || 0) + dt;
                while (s._glowT >= 0.05){
                    s._glowT -= 0.05;
                    const pp = s.petalInstance.getWorldPos(playerX, playerY, baseAngle);
                    petalGlow.push({ x: pp.x + (Math.random()-0.5)*12, y: pp.y + (Math.random()-0.5)*12,
                        vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20 - 6,
                        life: 0.5 + Math.random()*0.4, maxLife: 0.9, color: glowColorOf(s.rarity), radius: 2 + Math.random()*2.5 });
                }
            }
            for (let i=petalGlow.length-1;i>=0;i--){ const g=petalGlow[i]; g.x+=g.vx*dt; g.y+=g.vy*dt; g.life-=dt; if (g.life<=0) petalGlow.splice(i,1); }
            if (petalGlow.length > 800) petalGlow.splice(0, petalGlow.length-800);
        }
        // ===== 染色体(24)：给花瓣回血 =====
        // 每个装上的染色体(已加载的)在每个碰撞 tick 给"所有装备中的花瓣"回血；
        // 回血在伤害之前结算(优先级大于伤害)：只要一次回血 >= 这一 tick 受到的伤害，花瓣就永远不掉血。
        // 回血量随品质等比成长(和怪物伤害同一条曲线)，所以同品质的染色体能保住同品质怪打的花瓣。
        const CHROMO_HEAL_PER_TICK = 10;
        function applyChromosomeHeal(){
            let heal = 0;
            for (let i = 0; i < playerSlots; i++){
                const s = equippedSlots[i];
                if (!s || s.type !== 24 || !s.petalInstance) continue;   // 冷却/没加载的染色体也照样回血
                heal += CHROMO_HEAL_PER_TICK * rarityMult(s.rarity);
            }
            if (heal <= 0) return;
            for (let i = 0; i < equippedSlots.length; i++){
                const s = equippedSlots[i];
                if (!s || !s.petalInstance) continue;   // 没加载的花瓣也能被回血(重新加载时是满血)
                const mx = s.petalInstance.maxHp;
                if (!isFinite(mx)) continue;
                s.petalInstance.hp = Math.min(mx, Math.max(0, s.petalInstance.hp) + heal);
            }
        }
        function spawnParticles(x,y,color,count){
            for(let i=0;i<count;i++) particles.push({ x,y, vx:(Math.random()-0.5)*100, vy:(Math.random()-0.5)*100, life:0.5+Math.random()*0.5, maxLife:0.5, color, radius:2+Math.random()*3 });
        }

        function addPopup(text, color, x, y){
            popupTexts.push({ x, y, text, color, life:1.6, maxLife:1.6 });
        }

        // 空气花瓣：装备上才增大体型，卸下即恢复。普通+5%，最高级+1000%
        function getAirGrowth(rarity){ return 0.05 * Math.pow(200, rarity / 9); }
        function getPlayerSizeMult(){
            let m = 1;
            for (let i=0;i<playerSlots;i++){ const s=equippedSlots[i]; if(!s) continue;
                if (s && s.type === 13) m *= (1 + getAirGrowth(s.rarity));   // 只有空气花瓣增大体型(暗物质不增)
            }
            return m;
        }

        // 泡泡炸弹/魔法泡泡炸弹：碰到怪物爆炸，巨大推力 + 范围伤害
        function explodeBomb(slot, x, y){
            const type = slot.type;
            const rMult = rarityDmgMult(slot.rarity);   // 炸弹伤害：唯一=终末x10
            const dmg = (type === 11 ? 10 : 12) * rMult;
            const blastR = ((type === 11 ? 90 : 80) + slot.rarity * 10) * BOMB_BLAST_MULT; // 爆炸半径 x10
            const force = (type === 11 ? 260 : 300) * (1 + slot.rarity * 0.35);
            const color = type === 11 ? '#ffffff' : '#4d7bff';
            for (let m of monsters) {
                if (!m.alive) continue;
                const dx = m.x - x, dy = m.y - y, d = Math.hypot(dx, dy);
                if (d < m.radius + blastR) {
                    const a = Math.atan2(dy, dx) || 0;
                    m.takeDamage(dmg, x, y);
                    m.pushVX += Math.cos(a) * force;
                    m.pushVY += Math.sin(a) * force;
                }
            }
            for (let d of dummies) {
                if (!d.alive) continue;
                const dx = d.x - x, dy = d.y - y, dist = Math.hypot(dx, dy);
                if (dist < d.radius + blastR) d.takeDamage(dmg, x, y);
            }
            // 蜜蜂导弹也会被爆炸推开：只改变位置，导弹朝向与前进方向不变
            for (let mis of beeMissiles) {
                if (!mis.alive) continue;
                const dx = mis.x - x, dy = mis.y - y, d = Math.hypot(dx, dy);
                const reach = mis.radius + blastR;
                if (d < reach) {
                    const a = Math.atan2(dy, dx) || 0;
                    const near = 1 - Math.min(1, d / reach);          // 越靠近爆心推得越狠
                    mis.pushVX += Math.cos(a) * force * 0.8 * (0.5 + near);
                    mis.pushVY += Math.sin(a) * force * 0.8 * (0.5 + near);
                }
            }
            shockwaves.push({ x, y, r: 8, maxR: blastR, life: 0.45, maxLife: 0.45, color });
            spawnParticles(x, y, color, 18);
            slot.petalInstance.die(playerX, playerY);
        }

        // 经验/等级重算：把"已经攒下的总经验"按当前经验曲线重新换算成等级。
        // 经验曲线改版后，老存档的等级是按老曲线算的；这里等级只升不降，
        // 而且多出来的经验会继续升级(所以曲线更新后等级会跟着变，而不是卡在旧等级)。
        function recalcLevelFromExp(){
            const oldLv = Math.max(0, Math.min(1000000, Math.round(playerLevel) || 0));
            playerLevel = oldLv;
            if (!isFinite(playerExp) || playerExp < 0) playerExp = 0;
            let total = Math.min(EXP_MAX, playerExp);
            for (let l = 0; l < playerLevel; l++) total = Math.min(EXP_MAX, total + expNeededForLevel(l));   // 已获得的等级折算成经验
            let lv = 0, left = total, guard = 0;
            while (guard++ < 2000000 && left >= expNeededForLevel(lv)){ left -= expNeededForLevel(lv); lv++; }
            playerLevel = lv; playerExp = left; expToLevel = expNeededForLevel(lv);
            applyPlayerMaxHP();
            const want = Math.min(INIT_SLOTS + Math.floor(playerLevel / 10), MAX_SLOTS);
            if (want > playerSlots){ playerSlots = want; try{ rebuildSlots(); }catch(e){} }
            return playerLevel - oldLv;   // 上升了几级
        }
        function checkLevelUp(){
            if (!isFinite(playerExp) || playerExp < 0) playerExp = 0;
            playerExp = Math.min(EXP_MAX, playerExp);
            if (!isFinite(expToLevel) || expToLevel <= 0) expToLevel = expNeededForLevel(playerLevel);   // 坏数值救回来
            let guardLv = 0;
            while(guardLv++ < 1000000 && isFinite(expToLevel) && playerExp>=expToLevel){
                playerExp-=expToLevel; playerLevel++;
                applyPlayerMaxHP();
                expToLevel = expNeededForLevel(playerLevel);
                let newSlots = Math.min(INIT_SLOTS + Math.floor(playerLevel/10), MAX_SLOTS);
                if(newSlots>playerSlots){ playerSlots=newSlots; rebuildSlots(); }
            }
        }

        // 玩家血量上限 = 等级基础值 x 玩家血量天赋(单独生效)
        function applyPlayerMaxHP(){
            const base = 100 + Math.floor(playerLevel/10) * 100;
            playerMaxHP = Math.round(base * getTalentMult('playerHp'));
            if (playerHP > playerMaxHP) playerHP = playerMaxHP;
        }

        // 轨道分配：固定步长按"可用位置数"均分；暗物质不画本体，只把它的那一段位置占掉(空隙)
        // 轨道分配：每个主槽一个固定轨道位置(步长不变)；暗物质没有本体，但把它那一段位置占掉=留出空隙
        // 轨道分配：均匀分布(和没装暗物质时一样)。
        // 暗物质没有本体，它的"占用"只按容量算：占掉自身+后面 span-1 个位置，多出来的花瓣放不下就不上轨道。
        // 轨道位置：每装备一个花瓣就算 1 个位置；暗物质占 N 个位置(普通5/传奇100/唯一2048)
        function redistributeAngles() {
            let others = 0, dmSpan = 0;
            for (let i = 0; i < playerSlots; i++) {
                const s = equippedSlots[i];
                if (!s || s.type === 5) continue;              // 触角不占轨道
                if (s.type === 26) dmSpan += darkMatterOrbitSpan(s.rarity);   // 暗物质：一个顶 N 个位置
                else others++;
            }
            const total = Math.max(1, others + dmSpan);
            const step = (Math.PI * 2) / total;
            let idx = 0;
            for (let i = 0; i < playerSlots; i++) {
                const s = equippedSlots[i];
                if (!s || s.type === 5 || s.type === 26) continue;   // 暗物质没有本体
                s.angleOffset = idx * step;
                if (s.petalInstance) s.petalInstance.angleOffset = s.angleOffset;
                idx++;
            }
        }

        // 槽位规范化：主槽(0..N-1)有花瓣实例=装备中；副槽(N..2N-1)纯储物，无实例
        function normalizeSlotEntry(i){
            const s=equippedSlots[i];
            if(!s) return;
            s.slotIndex=i;
            if(i<playerSlots){
                if(!s.petalInstance){ s.petalInstance=new PetalInstance(s.type,s.rarity,i,0); s.angleOffset=0; }
            } else {
                if(s.petalInstance){ s.petalInstance.alive=false; s.petalInstance=null; }
            }
        }

        function rebuildSlots(){
            // 总槽位 = 主槽数 x2：主槽 0..N-1，副槽 N..2N-1（每个主槽都有对应副槽）
            const total = playerSlots * 2;
            const old = equippedSlots;
            equippedSlots = new Array(total).fill(null);
            for(let i=0;i<old.length && i<total;i++){
                if(old[i]){ old[i].slotIndex = i; equippedSlots[i] = old[i]; }
            }
            for(let i=total;i<old.length;i++){
                if(old[i]) addToBackpack(old[i].type, old[i].rarity); // 缩小时归还多余花瓣
            }
            redistributeAngles(); renderEquipBar();
        }

        function equipPetal(slot, type, rarity){
            if(slot>=equippedSlots.length||equippedSlots[slot]) return false;
            equippedSlots[slot] = {type,rarity,angleOffset:0,petalInstance:null};
            normalizeSlotEntry(slot);
            redistributeAngles(); renderEquipBar(); return true;
        }

        // 海绵离开主槽(卸下/换到副槽)时，把它吸收的伤害一次性还给玩家
        function applySpongeReturnOnUnequip(slotData){
            if (!slotData || slotData.type !== 6 || !slotData.petalInstance) return 0;
            const d = slotData.petalInstance.absorbedDamage || 0;
            if (d <= 0) return 0;
            slotData.petalInstance.absorbedDamage = 0;
            if (!godMode) playerHP -= d;
            return d;
        }
        function unequipSlot(slot){
            if(slot>=equippedSlots.length||!equippedSlots[slot]) return null;
            let s = equippedSlots[slot];
            applySpongeReturnOnUnequip(s);   // 海绵：卸下时把吸收的伤害还给玩家
            if(s.petalInstance){ s.petalInstance.alive=false; s.petalInstance=null; }
            equippedSlots[slot]=null;
            redistributeAngles(); renderEquipBar(); return {type:s.type,rarity:s.rarity};
        }

        function addToBackpack(type, rarity, count=1) {
            const existing = backpack.find(b => b.type === type && b.rarity === rarity);
            if (existing) existing.count += count; else backpack.push({type, rarity, count});
        }

        function removeFromBackpackByItem(type, rarity) {
            const idx = backpack.findIndex(b => b.type === type && b.rarity === rarity);
            if (idx === -1) return false;
            if (backpack[idx].count > 1) backpack[idx].count--; else backpack.splice(idx, 1);
            return true;
        }

        function countInBackpack(type, rarity) { const item = backpack.find(b => b.type === type && b.rarity === rarity); return item ? item.count : 0; }
        // 背包里能有的花瓣都能合(不再限制前几种)；终末(10)走锻造那条路
        function canCraft(type, rarity) { return rarity < 10 && countInBackpack(type, rarity) >= CRAFT_COUNT; }
        function doCraft(type, rarity) {
            if (!canCraft(type, rarity)) return false;
            const rate = craftSuccessRates[rarity];
            if (Math.random() >= rate) {
                const idx = backpack.findIndex(b => b.type === type && b.rarity === rarity);
                if (idx === -1) return false;
                const broken = 1 + Math.floor(Math.random() * 4);
                backpack[idx].count -= broken;
                if (backpack[idx].count <= 0) backpack.splice(idx, 1);
                return broken;
            }
            const idx = backpack.findIndex(b => b.type === type && b.rarity === rarity);
            if (idx === -1) return false;
            backpack[idx].count -= CRAFT_COUNT;
            if (backpack[idx].count <= 0) backpack.splice(idx, 1);
            if (rarity < 9) addToBackpack(type, rarity + 1);
            return true;
        }

        function showCraftFeedback(text) { const fb = document.getElementById('craftFeedback'); if (!fb) return; fb.textContent = text; if (feedbackTimer) clearTimeout(feedbackTimer); feedbackTimer = setTimeout(() => { fb.textContent = ''; }, 2000); }
        let feedbackTimer = null;

        function initDummies() {
            dummies = [];
            let currentX = -2000;
            for (let r = 0; r < 12; r++) {
                const radius = BASE_MON_RADIUS * Math.pow(SIZE_MULT, r);
                const xPos = currentX + radius;
                dummies.push(new TrainingDummy(xPos, 0, r));
                currentX += radius * 2 + 80;
            }
        }

        function resetAllDummies() { for (let d of dummies) d.resetStats(); }

        // 区域索引(用于每区域怪物上限)：大世界按正方形环，地图按地形等级
        // 区域=大世界的正方形环 / 地图的等级带；高于传奇的区域每区域最多 5 个怪
        function regionKeyOf(x, y){ return 'L' + regionRarityFor(x, y); }
        // 刷怪：可以在任何玩家看不到的地方生成(训练场不刷怪)
        function spawnMonstersAround(px, py){
            const def = getMapDef();
            // 只清理死掉且离得很远的怪；活着的怪一律保留(视野外的也不会被回收)
            monsters = monsters.filter(m => m.alive || Math.hypot(m.x - px, m.y - py) < 2000);
            if (def.mode === MODE_TRAINING || def.kinds.length === 0) return;
            // 自定义地图：只按画好的刷怪区刷怪
            if (def.spawnAreas && def.spawnAreas.length){ spawnInAuthoredAreas(def, px, py); return; }
            const alive = monsters.filter(m => m.alive).length;
            const target = Math.max(8, monsterSpawnTarget);   // 刷怪总量
            const half = getMapHalf() - WALL_T - 120;
            // 每个区域已有个数：只统计一次(以前在循环里每次 filter 一遍，怪多时是 O(n²))
            const regionCount = new Map();
            for(const mm of monsters){ if(!mm.alive) continue; const k = regionKeyOf(mm.x, mm.y); regionCount.set(k, (regionCount.get(k)||0) + 1); }
            for (let i = alive; i < target; i++) {
                // 大世界=最初的地图：怪刷在玩家周围；其它地图：大部分玩家附近、少量分布在地图任意位置(含视野外)
                let sx, sy;
                if (def.mode === MODE_WORLD || Math.random() < 0.85) {
                    // 大部分怪刷在玩家附近一圈(保证身边怪够多)，缩小时这圈也跟着稍微放大但不会散得太开
                    const visR = Math.max(900, Math.min(getVisibleWorldRadius() * 0.9, 1500));
                    const angle = Math.random() * Math.PI * 2, dist = 500 + Math.random() * visR;
                    sx = px + Math.cos(angle) * dist; sy = py + Math.sin(angle) * dist;
                } else {
                    sx = (Math.random() * 2 - 1) * half; sy = (Math.random() * 2 - 1) * half;
                }
                sx = Math.max(-half, Math.min(half, sx)); sy = Math.max(-half, Math.min(half, sy));
                // 不要生成在墙体/房室墙里
                const stx = Math.floor(sx / TERRAIN_TILE), sty = Math.floor(sy / TERRAIN_TILE);
                if (terrainSolidTile(stx, sty) || terrainSolidTile(stx + 1, sty) || terrainSolidTile(stx, sty + 1) || terrainSolidTile(stx + 1, sty + 1)) continue;
                const rarity = getRegionRarity(sx, sy);
                const key = regionKeyOf(sx, sy);
                const usedInRegion = regionCount.get(key) || 0;
                // 高品质区域(传奇及以上)每区域上限，其余区域不限
                if (rarity >= 6 && usedInRegion >= REGION_MONSTER_CAP) continue;
                // 大世界可以刷出所有生物(以后加新生物也自动包含)；其它地图只刷自己的名单；魔法地图再筛出能变种的
                const kindsPool = (def.mode === MODE_WORLD) ? Object.keys(CREATURE_DEFS) : def.kinds;
                const kindPool = def.magicOnly ? kindsPool.filter(k => (CREATURE_DEFS[k] || {}).magicKind) : kindsPool;
                if (kindPool.length === 0) return;
                const kind = kindPool[Math.floor(Math.random() * kindPool.length)];
                const kdef = CREATURE_DEFS[kind] || CREATURE_DEFS.normal;
                const useVariant = (Math.random() < MAGIC_VARIANT_RATE || def.magicOnly) && kdef.magicKind;
                monsters.push(new Monster(sx, sy, rarity, useVariant ? kdef.magicKind : kind));
                regionCount.set(key, usedInRegion + 1);
            }
            // 唯一品质(11)怪：只在大世界最后两个等级区带(x=18000~22000)生成，全图同时最多1个
            if (def.mode === MODE_WORLD && !monsters.some(m => m.alive && m.rarity === 11) && Math.random() < 0.02) {
                const ux = (MAX_MAP_RARITY - 1) * REGION_SIZE + Math.random() * (REGION_SIZE * 2);
                const uy = (Math.random() * 2 - 1) * (getMapHalf() - WALL_T - 2000);
                monsters.push(new Monster(ux, uy, 11, Math.random() < BUBBLE_SPAWN_RATE ? 'bubble' : 'normal'));
            }
        }

        function resolveMonsterCollisions() {
            // 怪多了以后两两检测是 O(n²)，会直接拖垮帧率：
            // 只让"屏幕内的怪"参与分离，并且先用包围盒快速排除(绝大多数配对连 hypot 都不用算)
            for (let i=0;i<monsters.length;i++) { const a=monsters[i]; if(!a.alive || !isMonsterOnScreen(a)) continue;
                for (let j=i+1;j<monsters.length;j++) { const b=monsters[j]; if(!b.alive) continue;
                    const rSum=a.radius+b.radius;
                    const dx=a.x-b.x; if(dx>rSum||dx<-rSum) continue;
                    const dy=a.y-b.y; if(dy>rSum||dy<-rSum) continue;
                    const dist=Math.hypot(dx,dy),minDist=rSum;
                    if(dist<minDist&&dist>0.001){ const angle=Math.atan2(dy,dx); const overlap=(minDist-dist)/2;
                        a.x+=Math.cos(angle)*overlap; a.y+=Math.sin(angle)*overlap; b.x-=Math.cos(angle)*overlap; b.y-=Math.sin(angle)*overlap;
                        const push=0.5; a.pushVX+=Math.cos(angle)*push; a.pushVY+=Math.sin(angle)*push; b.pushVX-=Math.cos(angle)*push; b.pushVY-=Math.sin(angle)*push; }
                }
            }
            for (let m of monsters) { if(!m.alive) continue;
                for (let d of dummies) { if(!d.alive) continue;
                    const dx=m.x-d.x,dy=m.y-d.y; const dist=Math.hypot(dx,dy),minDist=m.radius+d.radius;
                    if(dist<minDist&&dist>0.001){ const angle=Math.atan2(dy,dx); const overlap=minDist-dist;
                        m.x+=Math.cos(angle)*overlap; m.y+=Math.sin(angle)*overlap;
                        m.pushVX+=Math.cos(angle)*2; m.pushVY+=Math.sin(angle)*2; }
                }
            }
        }

        function resolvePlayerMonsterCollisions() {
            // 怪物被推动的比例：等级越高越难推(泡泡生物按原设定始终完全可推)
            function monsterPushFactor(m){
                if (m.type === 'bubble') return 1;
                return Math.max(0.05, 1 / (1 + (m.rarity || 0) * 0.6));
            }
            for (let m of monsters) { if(!m.alive) continue;
                const dx=playerX-m.x,dy=playerY-m.y; const dist=Math.hypot(dx,dy),minDist=getPlayerRadius()+m.radius;
                if(dist<minDist&&dist>0.001){ const angle=Math.atan2(dy,dx),overlap=minDist-dist;
                    // 怪物等级越高越难推动：低等级几乎整块被推走，高等级只被推开一点点、反而把玩家挤开
                    const pf = monsterPushFactor(m);
                    const ca = Math.cos(angle), sa = Math.sin(angle);
                    const playerShare = 1 - pf * 0.5;             // 怪越难推，玩家承担越多的分离
                    const pPush = Math.min(overlap * playerShare, 30);   // 单帧最多推开30px，避免大怪把玩家瞬间弹飞
                    playerX += ca * pPush; playerY += sa * pPush;
                    m.x -= ca * overlap * pf * 0.5; m.y -= sa * overlap * pf * 0.5;
                    if (pf >= 0.3) { m.pushVX -= ca * 5 * pf; m.pushVY -= sa * 5 * pf; }   // 容易被推时才给惯性
                    if (m.rarity > playerLevel) {                  // 等级比你高的怪：额外把你撞开(带粒子反馈)
                        playerKX += ca * 8; playerKY += sa * 8;
                    }
                }
            }
            for (let d of dummies) { if(!d.alive) continue;
                const dx=playerX-d.x,dy=playerY-d.y; const dist=Math.hypot(dx,dy),minDist=getPlayerRadius()+d.radius;
                if(dist<minDist&&dist>0.001){
                    const angle=Math.atan2(dy,dx),overlap=minDist-dist;
                    playerX+=Math.cos(angle)*overlap; playerY+=Math.sin(angle)*overlap;
                    playerTakeDamage(d.dmg * CONTACT_DMG_PER_TICK, '训练假人');   // 每个碰撞 tick 连续结算
                }
            }
        }

        function resolvePetalMonsterRepulsion() {
            const baseAngle = getPetalBase();
            for (let i=0;i<playerSlots;i++){ const s=equippedSlots[i]; if(!s) continue;
                if (!s || !s.petalInstance || !s.petalInstance.alive || !isPetalActive(s.petalInstance) || s.type === 5 || s.type === 6 || s.type === 10 || s.type === 13 || s.type === 26) continue;
                const p = s.petalInstance.getWorldPos(playerX, playerY, baseAngle);
                const isThorn = (s.type === 3 && s.rarity >= 5);
                const thornN = isThorn ? thornCount(s.rarity) : 0;
                const thornOffs = isThorn ? s.petalInstance.getThornOffsets(thornN) : null;
                const thornR = PETAL_RADIUS / THORN_COLLISION_DIV;
                for (let m of monsters) {
                    if (!m.alive) continue;
                    if (isThorn) {
                        // 每个血刺单独被推动(独立轨迹)
                        for (let ti = 0; ti < thornN; ti++) {
                            const a = p.angle + ti * Math.PI * 2 / thornN;
                            const off = thornOffs[ti];
                            const tx = p.x + Math.cos(a) * THORN_RING_RADIUS + off.ox;
                            const ty = p.y + Math.sin(a) * THORN_RING_RADIUS + off.oy;
                            const dx = tx - m.x, dy = ty - m.y, dist = Math.hypot(dx, dy);
                            const minDist = thornR + m.radius;
                            
                            if (dist < minDist && dist > 0.001) {
                                const ang = Math.atan2(dy, dx), ov = minDist - dist;
                                off.ox += Math.cos(ang) * ov; off.oy += Math.sin(ang) * ov;
                                clampThornOffset(off, PETAL_MAX_REPEL);
                            }
                        }
                        continue;
                    }
                    const dx = p.x - m.x; const dy = p.y - m.y; const dist = Math.hypot(dx, dy);
                    const minDist = PETAL_RADIUS + m.radius;
                    if (dist < minDist && dist > 0.001) {
                        const angle = Math.atan2(dy, dx); const overlap = minDist - dist;
                        s.petalInstance.offsetX += Math.cos(angle) * overlap;
                        s.petalInstance.offsetY += Math.sin(angle) * overlap;
                        clampPetalOffset(s.petalInstance, petalRepelCap());
                        // 明显的"被撞开"反馈：接触点冒白色小粒子(限频)
                        if (overlap > 6 && gameTime - (s.petalInstance.lastPushFx || 0) > 0.12) {
                            s.petalInstance.lastPushFx = gameTime;
                        }
                    }
                }
                for (let d of dummies) {
                    if (!d.alive) continue;
                    const dx = p.x - d.x; const dy = p.y - d.y; const dist = Math.hypot(dx, dy);
                    const minDist = PETAL_RADIUS + d.radius;
                    if (dist < minDist && dist > 0.001) {
                        const angle = Math.atan2(dy, dx); const overlap = minDist - dist;
                        s.petalInstance.offsetX += Math.cos(angle) * overlap;
                        s.petalInstance.offsetY += Math.sin(angle) * overlap;
                    }
                }
            }
        }

        function checkCollisions(){
            let baseAngle = getPetalBase();
            for(let i=0;i<playerSlots;i++){ const s=equippedSlots[i]; if(!s) continue;
                if(!s||!s.petalInstance||!s.petalInstance.alive||!isPetalActive(s.petalInstance)||s.type===5||s.type===6||s.type===10||s.type===13||s.type===26) continue;
                let p = s.petalInstance.getWorldPos(playerX,playerY,baseAngle);
                // 泡泡炸弹/魔法泡泡炸弹：碰到怪物即爆炸
                if(s.type===11||s.type===12){
                    let exploded = false;
                    for(let m of monsters){
                        if(!m.alive) continue;
                        if(Math.hypot(p.x-m.x,p.y-m.y) < PETAL_RADIUS+m.radius){ explodeBomb(s,p.x,p.y); exploded=true; break; }
                    }
                    if(!exploded) for(let d of dummies){
                        if(!d.alive) continue;
                        if(Math.hypot(p.x-d.x,p.y-d.y) < PETAL_RADIUS+d.radius){ explodeBomb(s,p.x,p.y); exploded=true; break; }
                    }
                    if(exploded) continue;
                }
                const hitPts = getPetalHitPoints(s, p);
                for(const hpt of hitPts){
                    for(let m of monsters){
                        if(!m.alive) continue;
                        let d = Math.hypot(hpt.x-m.x, hpt.y-m.y);
                        if(d < hpt.r+m.radius){
                            if(s.type===9){ if(s.petalInstance.takeDamage(m.dmg*0.5, playerX, playerY)) break; continue; }
                            if(s.type===14 && s.petalInstance.hitTimer>0) continue;
                            m.takeDamage(s.petalInstance.atk, hpt.x, hpt.y, s.type);   // 传花瓣类型：决定能不能推动该怪
                            if(s.type===14) s.petalInstance.hitTimer = Math.max(0, getPetalCD(14));
                            if(s.petalInstance.takeDamage(m.dmg*0.5, playerX, playerY)) break;
                        }
                    }
                }
                // 机械花的齿轮是"花瓣实体"：能被玩家花瓣打碎(碎了进入加载冷却)
                for(const hpt of hitPts){
                    for(let m of monsters){
                        if(!m.alive || !m.gears) continue;
                        for(const g of m.gears){
                            if(!g.alive) continue;
                            const gp = mechGearPos(m, g);
                            if(Math.hypot(hpt.x-gp.x, hpt.y-gp.y) < hpt.r + gp.r){
                                if(s.type===9){ if(s.petalInstance.takeDamage(m.dmg*0.5, playerX, playerY)) break; continue; }
                                damageMechGear(m, g, s.petalInstance.atk, hpt.x, hpt.y);
                                if(s.petalInstance.takeDamage(m.dmg*0.5, playerX, playerY)) break;
                            }
                        }
                    }
                }
                for(const hpt of hitPts){
                    for(let mis of beeMissiles){
                        if(!mis.alive) continue;
                        let d = Math.hypot(hpt.x-mis.x, hpt.y-mis.y);
                        if(d < hpt.r+mis.radius){
                            mis.hp -= s.petalInstance.atk;
                            if(mis.hp<=0) mis.alive = false;
                            if(s.petalInstance.takeDamage(mis.dmg*0.5, playerX, playerY)) break;
                        }
                    }
                }
                for(const hpt of hitPts){
                    for(let d of dummies){
                        if(!d.alive) continue;
                        let dist = Math.hypot(hpt.x-d.x, hpt.y-d.y);
                        if(dist < hpt.r+d.radius){
                            if(s.type===9){ if(s.petalInstance.takeDamage(5, playerX, playerY)) break; continue; }
                            if(s.type===14 && s.petalInstance.hitTimer>0) continue;
                            d.takeDamage(s.petalInstance.atk, hpt.x, hpt.y);
                            if(s.type===14) s.petalInstance.hitTimer = Math.max(0, getPetalCD(14));
                            if(s.petalInstance.takeDamage(5, playerX, playerY)) break;
                        }
                    }
                }
            }
            for(let mis of beeMissiles){
                if(!mis.alive) continue;
                for(let d of dummies){
                    if(!d.alive) continue;
                    const dist = Math.hypot(mis.x-d.x, mis.y-d.y);
                    if(dist < mis.radius+d.radius){
                        d.takeDamage(mis.dmg, mis.x, mis.y);
                        spawnParticles(mis.x, mis.y, getRarityColor(d.rarity), 5);
                        mis.alive = false;
                    }
                }
            }
            for(let mis of beeMissiles){
                if(!mis.alive) continue;
                const d = Math.hypot(playerX-mis.x, playerY-mis.y);
                if(d < getPlayerRadius()+mis.radius){
                    playerTakeDamage(mis.dmg, '蜜蜂');
                    const angle = Math.atan2(playerY-mis.y, playerX-mis.x);
                    playerX += Math.cos(angle) * 8;
                    playerY += Math.sin(angle) * 8;
                }
            }
            for(let d of drops){
                if(d.collected) continue;
                if(Math.hypot(playerX-d.x, playerY-d.y) < getPlayerRadius()+d.radius){
                    d.collected=true;
                    addToBackpack(d.type, d.rarity, d.count);
                    recordPetalPickup(d.type, d.rarity, d.count);
                }
            }
        }

        function update(dt){
            menuTime += dt;
            minimapZoom += (minimapZoomTarget - minimapZoom) * Math.min(1, 6 * dt);
            if (inMenu) { updateMenuBg(dt); return; }   // 主菜单：只跑背景动画
            const targetRadius = getOrbitTargetRadius();
            // 攻击(或防御/松开)时：在0.1秒内线性延伸到目标位置
            if (targetRadius !== orbitTweenTo) { orbitTweenFrom = currentOrbitRadius; orbitTweenTo = targetRadius; orbitTweenStart = gameTime - dt; }
            const orbitTp = Math.min(1, (gameTime - orbitTweenStart) / 0.1);
            currentOrbitRadius = orbitTweenFrom + (orbitTweenTo - orbitTweenFrom) * orbitTp;
            let mx=0,my=0;
            if(keys['w']||keys['arrowup']) my-=1; if(keys['s']||keys['arrowdown']) my+=1; if(keys['a']||keys['arrowleft']) mx-=1; if(keys['d']||keys['arrowright']) mx+=1;
            if(joystickActive){ mx+=joystickDX; my+=joystickDY; }
            let mag=Math.hypot(mx,my); if(mag>1){ mx/=mag; my/=mag; }
            // K 键切到鼠标控制：玩家朝鼠标方向移动，速度随"光标到玩家的距离"线性增长
            // 鼠标落在玩家内部(半径内)时不动；到 MOUSE_MOVE_RAMP_PX 屏幕像素处达到全速
            if(mouseMoveMode && mouseOnCanvas && !inMenu){
                const mw=screenToWorld(mouseScreenX, mouseScreenY);
                const mdx=mw.x-playerX, mdy=mw.y-playerY;
                const mdist=Math.hypot(mdx,mdy);
                if(mdist > getPlayerRadius()){
                    // 玩家恒在屏幕中心(cameraX/Y = playerX/Y)，所以用屏幕距离算比例，缩放时手感一致
                    const ps=worldToScreen(playerX, playerY);
                    const screenDist=Math.hypot(mouseScreenX-ps.x, mouseScreenY-ps.y);
                    const dead=getPlayerRadius()*viewScale;                        // 死区=玩家在屏幕上的半径
                    const ramp=Math.max(dead+1, MOUSE_MOVE_RAMP_PX);
                    const ratio=Math.max(0,Math.min(1,(screenDist-dead)/(ramp-dead)));   // 线性 0 → 1
                    mx=(mdx/mdist)*ratio; my=(mdy/mdist)*ratio; mag=ratio;
                } else { mx=0; my=0; mag=0; }
            }
            if (playerDead) { mx = 0; my = 0; mag = 0; playerKX = 0; playerKY = 0; }   // 死亡后不再移动
            const moveSpeed = playerSpeed * getTalentMult('moveSpeed'); // 移速天赋
            const pMoveX = mx*moveSpeed*dt + playerKX*dt, pMoveY = my*moveSpeed*dt + playerKY*dt;
            playerKX *= Math.exp(-3*dt); playerKY *= Math.exp(-3*dt);
            // 分步移动 + 边界墙/地形墙碰撞：速度再快也不会穿墙
            if (!playerDead) {
                const pcol = { x: playerX, y: playerY, radius: getPlayerRadius() };
                moveEntityWithCollision(pcol, pMoveX, pMoveY, true);
                playerX = pcol.x; playerY = pcol.y;
            } else { playerX += pMoveX; playerY += pMoveY; }
            checkPortals(dt);   // 自定义地图：踩到传送门就切图
            // 花瓣惯性：花瓣锚点以指数收敛跟随玩家 → 移动时花瓣略微拖在身后，停下后自动归位
            {
                const lagDist = Math.hypot(playerX - petalAnchorX, playerY - petalAnchorY);
                if (lagDist > PETAL_LAG_SNAP) { petalAnchorX = playerX; petalAnchorY = playerY; }   // 瞬移/切换地图：直接吸附
                else {
                    const lagK = Math.min(1, PETAL_LAG_RATE * dt);
                    petalAnchorX += (playerX - petalAnchorX) * lagK;
                    petalAnchorY += (playerY - petalAnchorY) * lagK;
                    // 移速很高时按比例算出的拖尾会过长，这里再夹一个上限，保持"略微"的手感
                    const dx = playerX - petalAnchorX, dy = playerY - petalAnchorY;
                    const d = Math.hypot(dx, dy);
                    if (d > PETAL_LAG_MAX) { petalAnchorX = playerX - dx / d * PETAL_LAG_MAX; petalAnchorY = playerY - dy / d * PETAL_LAG_MAX; }
                }
            }
            // 箭头：跟随摇杆/WASD输入方向，不跟随实际移动方向；无输入时朝右(0)
            if(mag > 0.01) orbitFace = Math.atan2(my, mx);
            else orbitFace = 0;
            cameraX=playerX; cameraY=playerY;

            // 轨道累计角：阴阳在主槽则反转方向(从当前角度继续，不跳位)
            // 阴阳(19)主槽 → 反转方向；主槽有齿轮(21) → 一圈一顿一顿地转(与机械花同一套逻辑)
            if (equippedSlots.slice(0, playerSlots).some(s => s && s.type === 19)) orbitAngle -= playerRingDelta(dt); else orbitAngle += playerRingDelta(dt);
            const totalBonus = getViewBonusTotal();
            viewScale = (1 / (1 + totalBonus / 100)) * zoomMultiplier;
            // 滚轮缩放限制在"自己当前的最大视野"之内：最远=当前视野(触角/天赋给的)，最近不超过MAX_ZOOM_IN
            const baseViewNow = 1 / (1 + totalBonus / 100);
            viewScale = Math.max(baseViewNow, Math.min(MAX_ZOOM_IN, viewScale));
            zoomMultiplier = Math.max(1, Math.min(MAX_ZOOM_IN / baseViewNow, viewScale / baseViewNow));
            playerSizeMult = getPlayerSizeMult(); // 空气花瓣：装备上才变大，卸下变小

            for(let i=0;i<playerSlots;i++){ const s=equippedSlots[i]; if(s && s.petalInstance) s.petalInstance.update(dt, petalAnchorX, petalAnchorY); }
            for(let m of monsters) if(m.alive && isMonsterOnScreen(m)) m.update(dt,playerX,playerY);
            // 怪物不能出墙：边界反弹摩擦 + 地形墙/box 碰撞
            {
                const mHalf = getMapHalf() - WALL_T;
                for (let m of monsters) {
                    if (!m.alive) continue;
                    const lim = mHalf - m.radius;
                    if (m.x > lim) { m.x = lim; m.pushVX = -Math.abs(m.pushVX) * 0.35; }
                    else if (m.x < -lim) { m.x = -lim; m.pushVX = Math.abs(m.pushVX) * 0.35; }
                    if (m.y > lim) { m.y = lim; m.pushVY = -Math.abs(m.pushVY) * 0.35; }
                    else if (m.y < -lim) { m.y = -lim; m.pushVY = Math.abs(m.pushVY) * 0.35; }
                    if (isMonsterOnScreen(m)) { const mcol = { x: m.x, y: m.y, radius: m.radius, pushVX: m.pushVX, pushVY: m.pushVY, vx: m.vx, vy: m.vy }; collideWithTerrain(mcol, false); m.x = mcol.x; m.y = mcol.y; m.pushVX = mcol.pushVX; m.pushVY = mcol.pushVY; }
                }
            }
            for(let d of dummies) if(d.alive) d.update(dt, playerX, playerY);
            for(let d of drops) d.update(dt);
            // 磁铁天赋：把半径内的掉落花瓣吸向玩家(距离越远收敛越快，靠近即被拾取)
            const magnetR = getTalentMagnetRadius();
            if (magnetR > 0) {
                const pullK = Math.min(1, MAGNET_PULL_RATE * dt);
                for (let d of drops) {
                    if (d.collected) continue;
                    const mdx = playerX - d.x, mdy = playerY - d.y;
                    const mdist = Math.hypot(mdx, mdy);
                    if (mdist > 0.001 && mdist < magnetR) {
                        d.x += mdx * pullK; d.y += mdy * pullK;
                        d.vx *= 0.2; d.vy *= 0.2; // 清掉原本飞出的速度，避免和吸附打架
                    }
                }
            }
            for(let m of beeMissiles) if(m.alive) m.update(dt);
            // 整个碰撞系统固定 75 次/秒：伤害结算 + 花瓣/怪/玩家之间的互相推开
            // 全部与屏幕刷新率解耦(否则 144Hz 屏上伤害和推开速度都会翻倍、30fps 时又变少)
            collisionAccum += dt;
            let colSteps = 0;
            while (collisionAccum >= COLLISION_STEP && colSteps < 8) {
                collisionAccum -= COLLISION_STEP;
                collisionTickActive = true;
                applyPlayerContactDamage();        // 玩家受到的接触伤害(怪/泡泡/齿轮)
                applyChromosomeHeal();             // 染色体：先回血(优先级大于伤害)
                resolveMonsterCollisions();        // 怪 ↔ 怪
                resolvePlayerMonsterCollisions();  // 玩家 ↔ 怪
                checkCollisions();                 // 花瓣 ↔ 怪/假人/导弹/齿轮 (伤害结算)
                resolvePetalMonsterRepulsion();    // 花瓣 ↔ 怪 (推开)
                collisionTickActive = false;
                colSteps++;
            }
            if (colSteps >= 8) collisionAccum = 0;   // 极端卡顿时丢弃积压，避免一次补算太多
            // 怪物推挤之后再把玩家夹回墙内(否则可能被推出边界)
            if (!playerDead) { const pcol2 = { x: playerX, y: playerY, radius: getPlayerRadius() }; collideWithTerrain(pcol2, true); playerX = pcol2.x; playerY = pcol2.y; }
            drops = drops.filter(d=>!d.collected&&d.lifetime>0); monsters = monsters.filter(m=>m.alive || Math.hypot(m.x-playerX,m.y-playerY)<2500);
            beeMissiles = beeMissiles.filter(m=>m.alive);
            playerMaxMagic = getMaxMagic();
            if(playerMagic > playerMaxMagic) playerMagic = playerMaxMagic;
            let heal=0, magicRegen=0;
            for(let i=0;i<playerSlots;i++){ const s=equippedSlots[i]; if(!s) continue;
                if(!s||!s.petalInstance||!s.petalInstance.alive||s.petalInstance.state!=='orbit') continue;
                const healMult = getTalentMult('healAmt'); // 回血花瓣量天赋
                if(s.type===1) heal+=PETAL_HEAL[1]*rarityMult(s.rarity)*healMult; // 叶子
                if(s.type===8){ // 魔法叶子：持续回血(同常规)+持续回魔
                    const rm=rarityMult(s.rarity);
                    heal+=PETAL_HEAL[1]*rm*healMult;
                    magicRegen+=MANA_LEAF_REGEN*rm;
                }
                if(s.type===14){ // 元素之力：每秒回血100/回魔50，每级x30
                    const rm=Math.pow(ELEMENT_MULT,s.rarity);
                    heal+=100*rm;
                    magicRegen+=50*rm;
                }
            }
            if(heal>0) playerHP=Math.min(playerMaxHP, playerHP+heal*dt);
            if(magicRegen>0) playerMagic=Math.min(playerMaxMagic, playerMagic+magicRegen*dt);
            if(playerHP<=0 && !godMode){
                // 死亡：留下尸体、不复活，由死亡界面决定是否回主菜单
                killPlayer(lastDamageCause || '未知');
            }
            if(godMode && playerHP <= 0) playerHP = playerMaxHP;
            spawnMonstersAround(playerX,playerY);
            for(let i=particles.length-1;i>=0;i--){ particles[i].x+=particles[i].vx*dt; particles[i].y+=particles[i].vy*dt; particles[i].life-=dt; if(particles[i].life<=0) particles.splice(i,1); }
            updatePetalGlow(dt);   // 终极以上花瓣的持续粒子
            for(let i=shockwaves.length-1;i>=0;i--){ const sw=shockwaves[i]; sw.life-=dt; sw.r+=(sw.maxR-sw.r)*Math.min(1,8*dt); if(sw.life<=0) shockwaves.splice(i,1); }
            for(let i=popupTexts.length-1;i>=0;i--){ popupTexts[i].y-=40*dt; popupTexts[i].life-=dt; if(popupTexts[i].life<=0) popupTexts.splice(i,1); }
            if (gameTime - lastAutoSave > 5) { lastAutoSave = gameTime; saveGame(false); } // 自动存档
            updateUI(); updateEquipBarCooldowns(); updateBackpackRarityColors(); updateSlotOverlays(); updateGammaRays(dt);
            // 实时刷新装备栏上海绵的吸收数值
            const spongeEls = document.querySelectorAll('#equipBar .equipSlot');
            for (const el of spongeEls) {
                const i = parseInt(el.dataset.slot);
                const s = equippedSlots[i];
                if (s && s.type === 6 && s.petalInstance) {
                    let badge = el.querySelector('.spongeBadge');
                    if (!badge) { badge = document.createElement('div'); badge.className='spongeBadge'; el.appendChild(badge); }
                    badge.textContent = formatNumber(Math.floor(s.petalInstance.absorbedDamage));
                }
            }
            if (activeModal === 'craft') {
                if (crafting && craftAnimStart !== null && gameTime - craftAnimStart >= craftAnimDuration) resolveCraft();

        // 传奇以上血刺：卡片图标用SVG绘制 正n边形顶点 + 三角顶点朝几何中心
        function thornIconUrl(rarity){
            const n=thornCount(rarity), R=10.5, t=5.4;
            let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">';
            for(let i=0;i<n;i++){
                const a=-Math.PI/2 + i*Math.PI*2/n;
                const cx=12+Math.cos(a)*R*0.62, cy=12+Math.sin(a)*R*0.62;
                const rot=a - Math.PI/2;
                const pt=(px,py)=>{ const c=Math.cos(rot), si=Math.sin(rot); return (cx+px*c-py*si).toFixed(2)+','+(cy+px*si+py*c).toFixed(2); };
                s+='<polygon points="'+pt(0,-t)+' '+pt(-t*0.7,t*0.55)+' '+pt(t*0.7,t*0.55)+'" fill="'+PETAL_COLORS[3]+'" stroke="'+getRarityColor(rarity)+'" stroke-width="0.9"/>';
            }
            return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(s + '</svg>') + '")';
        }
        function applyPetalShapeStyle(el, type, rarity){
            el.style.clipPath=''; el.style.borderRadius=''; el.style.backgroundImage='';
            const texUrl = petalTexUrl(type);
            if (texUrl){   // 有贴图：图标直接用贴图，不再用 CSS 拼形状
                el.style.background = 'transparent';
                el.style.backgroundImage = 'url("' + texUrl + '")';
                el.style.backgroundSize = 'contain';
                el.style.backgroundRepeat = 'no-repeat';
                el.style.backgroundPosition = 'center';
                return;
            }
            if(type===3 && (rarity||0) >= 5){ el.style.borderRadius='50%'; el.style.backgroundImage=thornIconUrl(rarity); el.style.backgroundSize='contain'; el.style.backgroundRepeat='no-repeat'; el.style.backgroundPosition='center'; return; }
            if(type===3||type===7) el.style.clipPath='polygon(50% 5%, 8% 88%, 92% 88%)';
            else if(type===4||type===6||type===11||type===12) el.style.borderRadius='0';
            else if(type===14) el.style.clipPath='polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
            else if(type===15) el.style.borderRadius='60% 10% 60% 10%';
            else el.style.borderRadius='50%';
        }

        function renderRecordList(){
            const list=document.getElementById('recordList'); if(!list) return;
            list.innerHTML='';
            const keys=new Set([...Object.keys(pickupRecord.session), ...Object.keys(pickupRecord.total)]);
            const items=[];
            for(const k of keys){
                const parts=k.split(':');
                const type=parseInt(parts[0]), rarity=parseInt(parts[1]);
                items.push({type, rarity, session:pickupRecord.session[k]||0, total:pickupRecord.total[k]||0});
            }
            if(items.length===0){ list.innerHTML='<p style="color:#888;text-align:center;padding:12px;">还没有捡到任何花瓣</p>'; return; }
            items.sort((a,b)=>(b.rarity-a.rarity)||(a.type-b.type));
            // 和背包完全一样的排列：按品质分组 → 品质标题 + 一行格子
            // 格子右上/右下角的大数字 = 总次，左上角小字 = 单次；悬停显示详细数值
            const groups={};
            for(const it of items){ (groups[it.rarity]=groups[it.rarity]||[]).push(it); }
            const rarities=Object.keys(groups).map(Number).sort((a,b)=>b-a);

                if(r===11) label.style.textShadow='0 0 5px rgba(255,255,255,0.95)';
                list.appendChild(label);

                    cell.appendChild(shape);

                    const badge=document.createElement('div'); badge.className='countBadge'; badge.textContent=formatNumber(it.total); cell.appendChild(badge);
                    const sess=document.createElement('div'); sess.className='recordSession'; sess.textContent='单'+formatNumber(it.session); cell.appendChild(sess);
                    cell.title=RARITY_NAMES[it.rarity]+' · 单次 '+formatNumber(it.session)+' / 总次 '+formatNumber(it.total);
                    row.appendChild(cell);
                }
                list.appendChild(row);
            });
        }

        function closeModal(){if(activeModal==='account' && !accounts.current) return; if(activeModal){if(activeModal==='craft'){crafting=false;craftAnimStart=null;}let el=document.getElementById('modal'+activeModal);if(el)el.remove();activeModal=null;}}
        function renderBagGrid(){

        function clickBackpackItem(type, rarity){

        function renderCraftGrid(){let grid=document.getElementById('craftGrid');if(!grid)return; grid.innerHTML='';const fb=document.getElementById('craftFeedback');if(fb)fb.textContent='';let craftable=[];for(let t=0;t<7;t++)for(let r=0;r<9;r++)if(canCraft(t,r))craftable.push({type:t,rarity:r});if(craftable.length===0){grid.innerHTML='<p style="color:#888;">没有可合成物品</p>';return;} for(let c of craftable){let cell=document.createElement('div');cell.className='itemCell';cell.style.borderColor=getRarityColor(c.rarity);let shape=document.createElement('div');shape.className='petalShape';shape.style.background=PETAL_COLORS[c.type];applyPetalShapeStyle(shape,c.type);cell.appendChild(shape);let badge=document.createElement('div');badge.className='countBadge';badge.textContent=countInBackpack(c.type,c.rarity)+'/5';cell.appendChild(badge);cell.addEventListener('click',()=>{const result=doCraft(c.type,c.rarity);if(result===true||typeof result==='number'){renderCraftGrid();renderBagGrid();if(typeof result==='number'){showCraftFeedback('合成失败，花瓣-'+result);}}});grid.appendChild(cell);}}

        // ===== 面板拖拽 =====
        let panelPositions = {};
        function makeDraggable(el, handle){
            let dragging=false, sx=0, sy=0, ox=0, oy=0;
            handle.addEventListener('pointerdown',(e)=>{
                e.preventDefault(); e.stopPropagation();
                dragging=true; sx=e.clientX; sy=e.clientY;
                const r=el.getBoundingClientRect(); ox=r.left; oy=r.top;
            });
            window.addEventListener('pointermove',(e)=>{
                if(!dragging) return;
                el.style.position='fixed';
                el.style.left=(ox+e.clientX-sx)+'px';
                el.style.top=(oy+e.clientY-sy)+'px';
                el.style.right='auto'; el.style.bottom='auto'; el.style.transform='none';
                panelPositions[el.id]={left:el.style.left, top:el.style.top};

            window.addEventListener('pointerup',()=>{ dragging=false; });
        }

        // ===== 副槽与装备栏(主槽一行/副槽一行) =====
        let swapAnimBusy=false;
        function swapMainSub(idx){
            if(idx<0||idx>9) return false;
            const sub=idx+playerSlots; // 副槽与主槽一一对应：主i ↔ 副(i+N)
            if(sub>=equippedSlots.length) return false;
            const a=equippedSlots[idx], b=equippedSlots[sub];
            if(!a && !b) return false;   // 主副槽都是空的：没得换
            const mainEl=document.querySelector('#mainRow .equipSlot[data-slot="'+idx+'"]');
            const subEl=document.querySelector('#subRow .equipSlot[data-slot="'+sub+'"]');
            if(swapAnimBusy || !mainEl || !subEl || typeof mainEl.getBoundingClientRect !== 'function'){
                swapMainSubData(idx); return true;
            }
            // 先立刻交换数据：阴阳换向、齿轮顿挫、金叶减CD 这类状态必须在按下的那一刻生效。
            // 以前是等 300ms 动画放完才换数据，所以阴阳换进主槽后方向要延迟 0.3 秒才翻。
            swapMainSubData(idx, true);   // deferRender=true：槽位重绘推迟到动画结束，动画期间看起来和以前一样
            // 滑动动画：花瓣从所在槽滑向对应槽
            swapAnimBusy=true;
            const ghosts=[];
            const spawn=(fromEl,toEl,slot)=>{
                const r1=fromEl.getBoundingClientRect(), r2=toEl.getBoundingClientRect();
                const g=document.createElement('div'); g.className='swapGhost';
                g.style.background=PETAL_COLORS[slot.type];
                g.style.borderColor=getRarityColor(slot.rarity);
                applyPetalShapeStyle(g, slot.type, slot.rarity);   // 有贴图就用贴图(和装备栏/背包一致)
                if(slot.type===3||slot.type===7) g.style.clipPath='polygon(50% 5%, 8% 88%, 92% 88%)';
                else if(slot.type===14) g.style.clipPath='polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
                g.style.width=r1.width+'px'; g.style.height=r1.height+'px';
                g.style.left=r1.left+'px'; g.style.top=r1.top+'px';
                document.body.appendChild(g);
                requestAnimationFrame(()=>{ g.style.left=r2.left+'px'; g.style.top=r2.top+'px'; });
                ghosts.push(g);
            };
            if(a) spawn(mainEl, subEl, a);
            if(b) spawn(subEl, mainEl, b);
            setTimeout(()=>{
                for(const g of ghosts){ if(g.remove) g.remove(); }
                swapAnimBusy=false;
                renderEquipBar();          // 数据早就换好了，这里只把槽位重绘成新排列
            }, 300);
            return true;
        }
        function swapMainSubData(idx, deferRender){
            const sub=idx+playerSlots;
            const a=equippedSlots[idx], b=equippedSlots[sub];
            equippedSlots[idx]=b; equippedSlots[sub]=a;
            if (a && a.type === 6) applySpongeReturnOnUnequip(a);   // 海绵换到副槽=卸下
            normalizeSlotEntry(idx); normalizeSlotEntry(sub);
            redistributeAngles();

        }

        // 重构：固定配方 20个碎片 + 1个齿轮 → 1个锯片(碎片与齿轮必须同品质)

        function pentagonPositions(){
            const stage=document.getElementById('craftStage');
            const w=(stage&&stage.clientWidth)?stage.clientWidth:420;
            const h=(stage&&stage.clientHeight)?stage.clientHeight:280;
            const cx=w/2, cy=h/2;
            const progress=(crafting&&craftAnimStart!==null)?Math.min(1,(gameTime-craftAnimStart)/craftAnimDuration):0;
            const rot=progress*Math.PI*0.6+(crafting?0:gameTime*0.15);
            const pulse=crafting?(1+0.18*Math.sin(progress*Math.PI*4)):(1+0.05*Math.sin(gameTime*2));
            const R=Math.min(86, h*0.62, w*0.42)*pulse;
            const pts=[];
            for(let i=0;i<5;i++){ const a=-Math.PI/2+i*(Math.PI*2/5)+rot; pts.push({x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R}); }
            pts.center={x:cx,y:cy};

        }

        function removeNFromBackpack(type,rarity,n){
            const idx=backpack.findIndex(b=>b.type===type&&b.rarity===rarity);

        function returnSlotsToBackpack(){

        function clickCraftPetal(t,r){
            if(crafting) return;

            if(cnt<=0) return;

            if(craftMode==='craft'){
                const slotsAll=activeSlots();
                returnSlotsToBackpack();
                const base=Math.floor(cnt/5), rem=cnt%5;
                const order=[0,1,2,3,4].sort(()=>Math.random()-0.5);
                for(let i=0;i<5;i++){ slotsAll[i].type=t; slotsAll[i].rarity=r; slotsAll[i].count=base; }
                for(let i=0;i<rem;i++) slotsAll[order[i]].count++;
                removeNFromBackpack(t,r,cnt);
                showCraftFeedback((cnt<CRAFT_COUNT? ('已放入 '+cnt+' 个，还差 '+(CRAFT_COUNT-cnt)+' 个才能合成') : ('已全部投入：'+PETAL_NAMES[t]+' x'+cnt+'（按「合成」开始）')));
                renderCraftList();
                return;
            }
            const slots=activeSlots();
            if(investAllHeld){
                returnSlotsToBackpack();
                const base=Math.floor(cnt/5), rem=cnt%5;
                const order=[0,1,2,3,4].sort(()=>Math.random()-0.5);
                for(let i=0;i<5;i++){ slots[i].type=t; slots[i].rarity=r; slots[i].count=base; }
                for(let i=0;i<rem;i++) slots[order[i]].count++;
                removeNFromBackpack(t,r,cnt);
                showCraftFeedback('全部投入：'+PETAL_NAMES[t]+' x'+cnt);
            } else {
                let need=0; for(const s of slots) if(s.count===0) need++;
                if(need===0){ showCraftFeedback('5个槽位已满'); return; }
                const take=Math.min(need,cnt);
                let placed=0;
                for(const s of slots){ if(placed>=take) break; if(s.count===0){ s.type=t; s.rarity=r; s.count=1; placed++; } }
                removeNFromBackpack(t,r,take);
                showCraftFeedback('放入 '+take+' 个 '+PETAL_NAMES[t]);
            }
            renderCraftList();
        }
        function startCraft(){

                if(countInBackpack(R.gearType,r) < R.gearCount){ showCraftFeedback('齿轮不足：需要 '+R.gearCount+' 个'+RARITY_NAMES[r]+'齿轮'); return; }

                crafting=true; craftAnimStart=gameTime; craftResult=null;
