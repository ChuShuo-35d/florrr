            const slots=activeSlots();
            const filled=slots.filter(s=>s.count>0);
            if(filled.length<5){ showCraftFeedback(craftMode==='forge'?'需要5个终末花瓣(点击同一种填入)':'需要5个槽位都放入花瓣'); return; }
            const t=slots[0].type, r=slots[0].rarity;
            if(!slots.every(s=>s.type===t&&s.rarity===r)){ showCraftFeedback('5个槽位必须为同种同品质花瓣'); return; }
            if(craftMode==='forge'){
                if(r!==10){ showCraftFeedback('锻造需要终末品质花瓣'); return; }
                if(countUniquePetals(t)>0){ showCraftFeedback('已有 唯一·'+PETAL_NAMES[t]+'，同种唯一花瓣只能锻造1个'); return; }
            } else {
                if(r>=10){ showCraftFeedback('该品质无法合成(终末/唯一不可合成)'); return; }
            }
            autoCraftRounds=0; autoCraftSuccess=0; autoCraftFail=0; craftAnimDuration=0.9;
            crafting=true; craftAnimStart=gameTime; craftResult=null;
            showCraftFeedback(craftMode==='forge'?'锻造中...':'合成中...');
        }
        function resolveCraft(){
            craftAnimStart=null;
            if(craftMode==='refactor'){
                const R=REFACTOR_RECIPE, r=refactorRarity;
                craftResult=null; autoCraftSuccess=0; autoCraftFail=0;
                if(countInBackpack(R.shardType,r)>=R.shardCount && countInBackpack(R.gearType,r)>=R.gearCount){
                    removeNFromBackpack(R.shardType,r,R.shardCount);
                    removeNFromBackpack(R.gearType,r,R.gearCount);
                    addToBackpack(R.outType,r,R.outCount);
                    craftResult={type:R.outType,rarity:r,count:R.outCount,time:gameTime};
                    autoCraftSuccess=1;
                    const c=pentagonPositions().center;
                    for(let i=0;i<26;i++) craftParticles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*180,vy:(Math.random()-0.5)*180,life:1,maxLife:1,color:getRarityColor(r)});
                    showCraftFeedback('重构完成：获得 '+RARITY_NAMES[r]+'锯片 x'+R.outCount);
                } else {
                    autoCraftFail=1;
                    showCraftFeedback('材料不足，重构失败');
                }
                crafting=false;
                renderCraftList();
                return;
            }
            const slots=activeSlots();
            // 一次合成完毕：循环处理所有轮次，直到剩余不足5个
            let guard=0;
            let produced=null;   // 这一轮总共合出来什么、多少个(中心显示用)
            while(guard<100000){
                guard++;
                if(!(slots[0] && slots[0].count>0)) break;
                const r=slots[0].rarity;
                const t=slots[0].type;
                if(craftMode==='forge'){
                    if(countUniquePetals(t)>0) break; // 同种唯一花瓣全图仅1个
                    for(const s of slots) s.count--;
                    addToBackpack(t,11,1);
                    produced = { type:t, rarity:11, count:(produced && produced.rarity===11 && produced.type===t ? produced.count : 0) + 1 };
                    autoCraftSuccess++;
                } else {
                    if(r>=10) break;
                    const success=Math.random()<craftSuccessRates[r];
                    if(success){
                        for(const s of slots) s.count--;
                        addToBackpack(t,r+1,1);
                        produced = { type:t, rarity:r+1, count:(produced && produced.rarity===r+1 && produced.type===t ? produced.count : 0) + 1 };
                        autoCraftSuccess++;
                    } else {
                        let broken=1+Math.floor(Math.random()*4); // 最多损失4个
                        let need=Math.min(broken,5);
                        const pool=slots.filter(s=>s.count>0);
                        while(need>0&&pool.length>0){
                            const s=pool[Math.floor(Math.random()*pool.length)];
                            s.count--; need--;
                            if(s.count<=0){ s.type=null; s.rarity=0; }
                        }
                        autoCraftFail++;
                    }
                }
                rebalanceActiveSlots();
                if(slots.reduce((a,s)=>a+s.count,0) < 5) break;
            }
            rebalanceActiveSlots();
            autoCraftRounds = guard;
            // 中心显示"这次一共合出来几个"，剩在槽位里的零头放回背包
            craftResult = produced ? { type:produced.type, rarity:produced.rarity, count:produced.count, time:gameTime } : null;
            returnSlotsToBackpack();
            // 统一结算动画效果
            const c=pentagonPositions().center;
            if(autoCraftSuccess>0){
                const col = craftResult ? getRarityColor(craftResult.rarity) : '#ffd700';
                for(let i=0;i<26;i++) craftParticles.push({x:c.x,y:c.y,vx:(Math.random()-0.5)*180,vy:(Math.random()-0.5)*180,life:1,maxLife:1,color:col});
            }
            if(autoCraftFail>0){
                const pts=pentagonPositions();
                for(let i=0;i<34;i++){
                    const p=pts[Math.floor(Math.random()*5)];
                    craftParticles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*230,vy:(Math.random()-0.5)*230-60,life:0.9,maxLife:0.9,color:['#ff6b6b','#ffd700','#ff9f43'][Math.floor(Math.random()*3)]});
                }
            }
            crafting=false;
            if(craftMode==='forge'){
                showCraftFeedback(autoCraftSuccess>0?('锻造完成：成功 '+autoCraftSuccess+' 次'):'该类型已有唯一花瓣，无法继续锻造');
            } else {
                showCraftFeedback('合成完毕：成功 '+autoCraftSuccess+' 次，失败 '+autoCraftFail+' 次');
            }
            renderCraftList();
        }
        function rebalanceActiveSlots(){
            const slots=activeSlots();
            let t=null, r=0, total=0;
            for(const s of slots){ total+=s.count; if(s.count>0 && t===null){ t=s.type; r=s.rarity; } }
            if(total<=0 || t===null){ for(const s of slots){ s.type=null; s.rarity=0; s.count=0; } return; }
            const base=Math.floor(total/5), rem=total%5;
            const order=[0,1,2,3,4].sort(()=>Math.random()-0.5);
            for(let i=0;i<5;i++){ slots[i].type=t; slots[i].rarity=r; slots[i].count=base; }
            for(let i=0;i<rem;i++) slots[order[i]].count++;
        }
        // 唯一花瓣唯一性按类型判定：同种唯一花瓣全图仅1个，不同种可并存
        function countUniquePetals(type){
            let c=0;
            for(const b of backpack) if(b.rarity===11 && b.type===type) c+=b.count;
            for(const s of equippedSlots) if(s&&s.rarity===11 && s.type===type) c++;
            for(const d of drops) if(!d.collected&&d.rarity===11 && d.type===type) c+=d.count;
            return c;
        }
        // 槽位改为DOM元素绘制，放在固定容器内(overflow:hidden)，物理上不可能与按钮/锻造条叠加
        function drawCraftCanvas(){
            const stage=document.getElementById('craftStage');
            if(!stage || typeof stage.appendChild !== 'function') return;
            if(craftMode==='refactor'){ drawRefactorStage(stage); return; }
            if(!stage._slots || stage._slots.length!==5){
                stage._slots=[];
                for(let i=0;i<5;i++){ const d=document.createElement('div'); d.className='craftSlot'; stage.appendChild(d); stage._slots.push(d); }
            }
            const pts=pentagonPositions();
            const slots=activeSlots();
            const slotSize=52;
            if(stage._refactorEls){ for(const k in stage._refactorEls){ const el=stage._refactorEls[k]; if(el&&el.style) el.style.display='none'; } }
            for(let i=0;i<5;i++){
                const d=stage._slots[i]; const s=slots[i]; d.style.display='flex';
                d.style.left=(pts[i].x-slotSize/2)+'px';
                d.style.top=(pts[i].y-slotSize/2)+'px';
                d.style.width=slotSize+'px'; d.style.height=slotSize+'px';
                // 合成槽也用卡片显示：中心花瓣 + 品质色背景 + 下方名字
                const filled = s.count>0;
                d.style.borderRadius='10px';
                d.style.flexDirection='column';
                d.style.fontSize=filled?'12px':'22px';
                d.style.borderColor=filled?getRarityColor(s.rarity):'rgba(255,255,255,0.25)';
                d.style.background=filled?getRarityColor(s.rarity):'rgba(30,30,45,0.95)';
                d.style.boxShadow=filled?'inset 0 0 0 100px rgba(0,0,0,0.42)':'none';
                d.style.color=filled?'#000':'rgba(255,255,255,0.45)';
                d.innerHTML='';
                if(!filled){ d.innerHTML='+'; continue; }
                const shape=document.createElement('div'); shape.className='petalShape';
                shape.style.width='20px'; shape.style.height='20px'; shape.style.background=PETAL_COLORS[s.type];
                applyPetalShapeStyle(shape, s.type, s.rarity);
                d.appendChild(shape);
                const nm=document.createElement('div'); nm.className='slotName'; nm.textContent=PETAL_NAMES[s.type];
                d.appendChild(nm);
                if(s.count>1){ const c=document.createElement('span'); c.className='slotCount'; c.textContent='x'+formatNumber(s.count); d.appendChild(c); }
            }
            let res=stage._result;
            if(craftResult && gameTime-craftResult.time<2.5){
                if(!res){ res=document.createElement('div'); res.className='craftSlot'; stage.appendChild(res); stage._result=res; }
                const s=76;
                res.style.left=(pts.center.x-s/2)+'px';
                res.style.top=(pts.center.y-s/2)+'px';
                res.style.width=s+'px'; res.style.height=s+'px';
                res.style.borderColor=getRarityColor(craftResult.rarity);
                res.style.background=PETAL_COLORS[craftResult.type];
                res.style.color='#000'; res.style.fontSize='13px';
                res.style.transform='rotate('+(Math.sin(gameTime*2)*0.25)+'rad)';
                res.innerHTML='<span class="craftResCount">x'+formatNumber(craftResult.count)+'</span><span class="slotName">'+PETAL_NAMES[craftResult.type]+'</span>';
            } else if(res){ if(res.remove) res.remove(); stage._result=null; }
            if(stage._particles){ for(const e of stage._particles){ if(e.remove) e.remove(); } }
            stage._particles=[];
            for(const p of craftParticles){
                const e=document.createElement('div'); e.className='craftParticle';
                e.style.left=p.x+'px'; e.style.top=p.y+'px';
                e.style.background=p.color;
                e.style.opacity=Math.max(0,p.life/p.maxLife);
                stage.appendChild(e); stage._particles.push(e);
            }
        }

        // 重构页面的舞台：碎片 x20 + 齿轮 x1 → 锯片 x1
        function drawRefactorStage(stage){
            if(!stage || typeof stage.appendChild!=='function') return;
            if(stage._slots) for(const d of stage._slots) d.style.display='none';
            if(stage._result){ if(stage._result.remove) stage._result.remove(); stage._result=null; }
            const R=REFACTOR_RECIPE, rarity=refactorRarity;
            if(!stage._refactorEls){
                const mk=(cls)=>{ const d=document.createElement('div'); d.className=cls; stage.appendChild(d); return d; };
                stage._refactorEls={ shard:mk('craftSlot'), plus:mk('refactorOp'), gear:mk('craftSlot'), arrow:mk('refactorOp'), out:mk('craftSlot') };
            }
            const E=stage._refactorEls;
            const size=62, cy=140;
            const placeSlot=(el,x)=>{
                el.style.display='flex'; el.style.flexDirection='column';
                el.style.left=(x-size/2)+'px'; el.style.top=(cy-size/2)+'px';
                el.style.width=size+'px'; el.style.height=size+'px'; el.style.borderRadius='10px';
            };
            const placeOp=(el,x,txt)=>{ el.style.display='flex'; el.style.left=(x-16)+'px'; el.style.top=(cy-16)+'px'; el.style.width='32px'; el.style.height='32px'; el.textContent=txt; };
            placeSlot(E.shard,80); placeSlot(E.gear,170); placeSlot(E.out,310);
            placeOp(E.plus,125,'+'); placeOp(E.arrow,240,'→');
            const fillSlot=(el,type,need,have)=>{
                const ok=have>=need;
                el.style.borderColor=ok?getRarityColor(rarity):'rgba(255,255,255,0.25)';
                el.style.background=ok?getRarityColor(rarity):'rgba(30,30,45,0.95)';
                el.style.boxShadow=ok?'inset 0 0 0 100px rgba(0,0,0,0.42)':'none';
                el.innerHTML='';
                const shape=document.createElement('div'); shape.className='petalShape';
                shape.style.width='20px'; shape.style.height='20px'; shape.style.background=PETAL_COLORS[type]; applyPetalShapeStyle(shape,type,rarity);
                el.appendChild(shape);
                const nm=document.createElement('div'); nm.className='slotName'; nm.textContent=PETAL_NAMES[type]; el.appendChild(nm);
                const c=document.createElement('span'); c.className='slotCount'; c.textContent=have+'/'+need; el.appendChild(c);
            };
            fillSlot(E.shard, R.shardType, R.shardCount, countInBackpack(R.shardType,rarity));
            fillSlot(E.gear, R.gearType, R.gearCount, countInBackpack(R.gearType,rarity));
            E.out.style.borderColor=getRarityColor(rarity);
            E.out.style.background=PETAL_COLORS[R.outType];
            E.out.innerHTML='';
            const oshape=document.createElement('div'); oshape.className='petalShape';
            oshape.style.width='22px'; oshape.style.height='22px'; oshape.style.background=PETAL_COLORS[R.outType]; applyPetalShapeStyle(oshape,R.outType,rarity);
            E.out.appendChild(oshape);
            const onm=document.createElement('div'); onm.className='slotName'; onm.textContent=PETAL_NAMES[R.outType]; E.out.appendChild(onm);
        }

        // ===== 配装保存系统 =====
        let loadouts=[]; let loadoutKeyHeld=false;
        function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function captureLoadout(name){
            const slots=[];
            equippedSlots.forEach((s,i)=>{ if(s) slots.push({slotIndex:i,type:s.type,rarity:s.rarity}); });
            loadouts.push({id:Date.now()+Math.floor(Math.random()*100000),name:name||('配装'+(loadouts.length+1)),slots});
            renderLoadoutList();
        }
        function equipLoadout(lo){
            for(let i=0;i<equippedSlots.length;i++){
                if(equippedSlots[i]){ const info=unequipSlot(i); if(info) addToBackpack(info.type,info.rarity); }
            }
            const missing=[];
            for(const it of lo.slots){
                if(it.slotIndex>=equippedSlots.length||equippedSlots[it.slotIndex]) continue;
                if(removeFromBackpackByItem(it.type,it.rarity)) equipPetal(it.slotIndex,it.type,it.rarity);
                else missing.push(PETAL_NAMES[it.type]+'·'+RARITY_NAMES[it.rarity]);
            }
            if(missing.length) alert('缺少花瓣：'+missing.join(','));
        }
        function deleteLoadout(id){ loadouts=loadouts.filter(l=>l.id!==id); renderLoadoutList(); }
        function moveLoadout(id,dir){
            const i=loadouts.findIndex(l=>l.id===id); const j=i+dir;
            if(i<0||j<0||j>=loadouts.length) return;
            const tmp=loadouts[i]; loadouts[i]=loadouts[j]; loadouts[j]=tmp;
            renderLoadoutList();
        }
        function encodeLoadout(l){ return 'S'+btoa(unescape(encodeURIComponent(JSON.stringify({name:l.name,slots:l.slots})))); }
        function encodeLoadoutSet(){ return 'F'+btoa(unescape(encodeURIComponent(JSON.stringify(loadouts.map(l=>({name:l.name,slots:l.slots})))))); }
        function decodeLoadoutCode(code){
            try{
                const raw=atob(code.slice(1));
                const obj=JSON.parse(decodeURIComponent(escape(raw)));
                if(code[0]==='S'){
                    loadouts.push({id:Date.now()+Math.floor(Math.random()*100000),name:obj.name||('配装'+(loadouts.length+1)),slots:obj.slots||[]});
                } else if(code[0]==='F'){
                    loadouts=(obj||[]).map(o=>({id:Date.now()+Math.floor(Math.random()*100000),name:o.name||'配装',slots:o.slots||[]}));
                } else return false;
                renderLoadoutList();
                return true;
            }catch(err){ return false; }
        }
        function applyLoadoutByIndex(i){ if(loadouts[i]) equipLoadout(loadouts[i]); }
        function renderLoadoutList(){
            const list=document.getElementById('loadoutList'); if(!list) return;
            list.innerHTML='';
            if(loadouts.length===0){ list.innerHTML='<p style="color:#888;text-align:center;padding:10px;">暂无配装</p>'; return; }
            loadouts.forEach((lo,idx)=>{
                const bar=document.createElement('div'); bar.className='loadoutBar';
                const info=document.createElement('div'); info.className='loadoutInfo';
                info.innerHTML='<b>'+escHtml(lo.name)+'</b> <span style="color:#888;font-size:10px;">'+lo.slots.length+'格</span>';
                const icons=document.createElement('div'); icons.className='loadoutIcons';
                for(const it of lo.slots){
                    const ic=document.createElement('span'); ic.className='loadoutIcon';
                    ic.style.background=PETAL_COLORS[it.type]; ic.style.borderColor=getRarityColor(it.rarity);
                    if(it.type===3||it.type===7) ic.style.clipPath='polygon(50% 5%, 8% 88%, 92% 88%)';
                    else if(it.type===14) ic.style.clipPath='polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)';
                    icons.appendChild(ic);
                }
                info.appendChild(icons);
                const btns=document.createElement('div'); btns.className='loadoutBtns';
                const mk=(txt,fn,cls)=>{ const b=document.createElement('button'); b.textContent=txt; b.className=cls||'ldbtn'; b.addEventListener('click',(e)=>{e.stopPropagation();fn();}); return b; };
                btns.appendChild(mk('↑',()=>moveLoadout(lo.id,-1)));
                btns.appendChild(mk('↓',()=>moveLoadout(lo.id,1)));
                btns.appendChild(mk('装备',()=>{equipLoadout(lo);}));
                btns.appendChild(mk('码',()=>{ const box=document.getElementById('loadoutCodeBox'); box.textContent=encodeLoadout(lo); }));
                btns.appendChild(mk('删除',()=>deleteLoadout(lo.id),'ldbtnDanger'));
                bar.appendChild(info); bar.appendChild(btns);
                list.appendChild(bar);
            });
        }
        function setupLoadoutModal(){
            const sBtn=document.getElementById('saveLoadoutBtn');
            const gBtn=document.getElementById('genLoadoutCodeBtn');
            const aBtn=document.getElementById('applyLoadoutCodeBtn');
            if(sBtn) sBtn.addEventListener('click',()=>{ const ni=document.getElementById('loadoutNameInput'); captureLoadout((ni&&ni.value.trim())||''); if(ni)ni.value=''; });
            if(gBtn) gBtn.addEventListener('click',()=>{ const box=document.getElementById('loadoutCodeBox'); box.textContent=encodeLoadoutSet(); });
            const cBtn=document.getElementById('copyLoadoutCodeBtn');
            if(cBtn) cBtn.addEventListener('click',()=>{
                const box=document.getElementById('loadoutCodeBox');
                const code=(box&&box.textContent)||'';
                if(!code) return;
                const done=()=>{ const old=box.textContent; box.textContent='已复制！'; setTimeout(()=>{ box.textContent=old; }, 1200); };
                if(navigator.clipboard && navigator.clipboard.writeText){
                    navigator.clipboard.writeText(code).then(done).catch(()=>{ fallbackCopyText(code); done(); });
                } else { fallbackCopyText(code); done(); }
            });
            if(aBtn) aBtn.addEventListener('click',()=>{
                const inp=document.getElementById('loadoutCodeInput'); const box=document.getElementById('loadoutCodeBox');
                if(decodeLoadoutCode(inp.value.trim())){ inp.value=''; box.textContent='已应用配装码'; }
                else box.textContent='配装码无效';
            });
            renderLoadoutList();
        }
        function renderTalentPanel(){
            const list=document.getElementById('talentList'); if(!list) return;
            const pts=document.getElementById('talentPoints');
            if(pts) pts.textContent='可用天赋点 '+getTalentAvailable()+' / 累计 '+getTalentTotalPoints()+'（等级 '+playerLevel+'，每级+1、个位5额外+15、个位0额外+50）';
            list.innerHTML='';
            for(const t of TALENTS){
                const row=document.createElement('div'); row.className='talentRow';
                const label=document.createElement('div'); label.className='rowLabel'; label.textContent=t.name;
                row.appendChild(label);
                const cur=getTalentLevel(t.key);
                for(let lv=1; lv<=TALENT_LEVELS; lv++){
                    const cell=document.createElement('div'); cell.className='talentCell';
                    const val=talentValue(t,lv), cost=talentCost(t,lv);
                    const valText = t.reduce
                        ? ('-'+val.toFixed(val<100?1:0)+'%')
                        : (t.unit==='直径' ? ('+'+val.toFixed(1)+'直径') : ('+'+val.toFixed(val<100?1:0)+'%'));
                    cell.innerHTML='<b>'+RARITY_NAMES[lv-1]+'</b><span>'+valText+'</span><span>'+cost+'点</span>';
                    if(lv<=cur) cell.classList.add('owned');
                    else if(cost<=getTalentAvailable()) cell.classList.add('next');  // 点数足够即可直接点击(可跳级)
                    else cell.classList.add('locked');
                    cell.title=(lv<=cur)
                        ? (t.name+'·'+RARITY_NAMES[lv-1]+'：'+valText+'（已点亮，长按取消该等级及其之后）')
                        : (t.name+'·'+RARITY_NAMES[lv-1]+'：'+valText+'，消耗 '+cost+' 天赋点（可直接点亮）');
                    // 点击=点亮；长按(0.5秒)=取消该等级及其之后
                    let lpTimer=null, lpDone=false;
                    cell.addEventListener('pointerdown',()=>{
                        lpDone=false;
                        lpTimer=setTimeout(()=>{
                            lpDone=true;
                            if(cancelTalent(t.key,lv)) renderTalentPanel();
                        },500);
                    });
                    const clearLp=()=>{ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } };
                    cell.addEventListener('pointerup',clearLp);
                    cell.addEventListener('pointerleave',clearLp);
                    cell.addEventListener('pointercancel',clearLp);
                    cell.addEventListener('click',()=>{
                        if(lpDone){ lpDone=false; return; }
                        if(buyTalent(t.key,lv)) renderTalentPanel();
                    });
                    row.appendChild(cell);
                }
                list.appendChild(row);
            }
        }

        function fallbackCopyText(text){
            const ta=document.createElement('textarea');
            ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta); ta.select();
            try{ document.execCommand('copy'); }catch(e){}
            ta.remove();
        }

        function allowsTextSelection(el){

        const UI_HIT_SELECTOR = '#uiLayer, .modalOverlay, .modalPanel, .loadoutPanel, .talentPanel, #equipBar, #btnRow, #topBar, #speedControl, #joystickArea, .craftPanel, button, input, select, textarea, a';

        function updateSlotOverlays(){

        // ===== 伽马射线：攻击状态下从花瓣位置沿花瓣朝向射出，发射后花瓣立刻进入冷却 =====
        const GAMMA_LOW_MULT = 2.7;    // 终极以下：2.7倍"基本"花瓣的所有数值
        const GAMMA_HIGH_MULT = 64;    // 终末及以上：64倍"元素之力"的数值
        const GAMMA_MAX_LEN = 9000;    // 光束最大射程(在 900 的基础上 ×10)
        const GAMMA_SPEED = 1500;      // 光束飞行速度
        const GAMMA_WIDTH = 6;         // 光束碰撞宽度(半径)
        class GammaRay {
            constructor(x,y,angle,rarity,atk){
                this.x=x; this.y=y; this.px=x; this.py=y;   // px/py=上一帧位置，用于线段碰撞
                this.angle=angle; this.rarity=rarity; this.atk=atk;
                this.alive=true; this.traveled=0; this.maxLen=GAMMA_MAX_LEN; this.hit=new Set();
            }
            update(dt){
                this.px=this.x; this.py=this.y;
                const step=GAMMA_SPEED*dt;
                this.x+=Math.cos(this.angle)*step; this.y+=Math.sin(this.angle)*step;
                this.traveled+=step;
                if(this.traveled>=this.maxLen) this.alive=false;
            }
        }
        function fireGammaRay(x,y,angle,rarity,atk){
            gammaRays.push(new GammaRay(x,y,angle,rarity,atk));
            spawnParticles(x,y,'#9dff5a',6);
        }
        function segmentPointDist(px,py,x1,y1,x2,y2){
            const dx=x2-x1, dy=y2-y1, len2=dx*dx+dy*dy;
            if(len2<=0.0001) return Math.hypot(px-x1, py-y1);
            let t=((px-x1)*dx+(py-y1)*dy)/len2;
            t=Math.max(0,Math.min(1,t));
            return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
        }
        function updateGammaRays(dt){
            for(let i=gammaRays.length-1;i>=0;i--){
                const g=gammaRays[i];
                g.update(dt);
                for(const m of monsters){
                    if(!m.alive || g.hit.has(m)) continue;
                    if(segmentPointDist(m.x,m.y,g.px,g.py,g.x,g.y) < m.radius + GAMMA_WIDTH){
                        g.hit.add(m); m.takeDamage(g.atk, g.x, g.y, 25); spawnParticles(m.x,m.y,'#9dff5a',6);
                    }
                }
                for(const d of dummies){
                    if(!d.alive || g.hit.has(d)) continue;
                    if(segmentPointDist(d.x,d.y,g.px,g.py,g.x,g.y) < d.radius + GAMMA_WIDTH){
                        g.hit.add(d); d.takeDamage(g.atk, d.x, d.y); spawnParticles(d.x,d.y,'#9dff5a',6);
                    }
                }
                if(!g.alive) gammaRays.splice(i,1);
            }
        }
        function drawGammaRays(){

            }
        }

            return -1;
        }

        let devTeleportMode = false;     // 开发者：点击传送
        let lastDamageCause = '怪物';
        let entityIdSeq = 0;   // 实体唯一 id(用于花瓣受击冷却)    // 死亡界面显示的致死来源

        function getMapDef(id){ return MAP_DEFS[id || currentMapId] || MAP_DEFS.world; }
        function getMapHalf(){ return getMapDef().size / 2; }
        function inTraining(){ return getMapDef().mode === MODE_TRAINING; }

        // ---- 地形哈希 / 噪声 ----
        function hash2(ix, iy, seed){
            let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + Math.imul(seed | 0, 2246822519);
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            h = h ^ (h >>> 16);
            return ((h >>> 0) % 100000) / 100000;
        }
        function valueNoise(x, y, scale, seed){
            return valueNoiseRaw(x, y, scale, seed);
        }
        // 由字符串生成稳定种子(每张地图的房室布局不同)
        function noiseSeedOf(id){
            let s = 2166136261;
            for (let i = 0; i < id.length; i++) { s ^= id.charCodeAt(i); s = Math.imul(s, 16777619); }
            return s | 0;
        }
        function valueNoiseRaw(x, y, scale, seed){
            const fx = x / scale, fy = y / scale;
            const ix = Math.floor(fx), iy = Math.floor(fy);
            const tx = fx - ix, ty = fy - iy;
            const sm = t => t * t * (3 - 2 * t);
            const a = hash2(ix, iy, seed), b = hash2(ix + 1, iy, seed), c = hash2(ix, iy + 1, seed), d = hash2(ix + 1, iy + 1, seed);
            const u = sm(tx), v = sm(ty);
            return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
        }
        // ===== 地图主路：一条很宽的路通向深处(路尽头=高等级，路两侧=低等级) =====
        const ROAD_HALF = 480;          // 路面半宽(路很宽)
        const ROAD_WALL_T = 300;         // 路两侧墙带厚度          // 路面半宽(路很宽)
        const roadCache = {};
        function roadPathFor(def){
            if (roadCache[def.id]) return roadCache[def.id];
            const half = def.size / 2 - WALL_T - 2500;
            const s = noiseSeedOf(def.id) % 5000;
            const ang = (hash2(3, 9, s) * 2 - 1) * Math.PI;              // 每张地图大致走向不同
            const pts = [{ x: 0, y: 0 }];
            const n = 6;
            for (let i = 1; i <= n; i++) {
                const t = i / n, r = half * t;
                const wob = (hash2(i, 17, s) - 0.5) * half * 0.3;        // 路稍微蜿蜒
                pts.push({ x: Math.cos(ang) * r - Math.sin(ang) * wob, y: Math.sin(ang) * r + Math.cos(ang) * wob });
            }
            roadCache[def.id] = pts;
            return pts;
        }
        // 点到路的距离 + 沿路进度(0=起点 1=尽头)
        function roadInfoAt(def, x, y){
            const pts = roadPathFor(def);
            let total = 0;
            for (let i = 0; i < pts.length - 1; i++) total += Math.hypot(pts[i+1].x - pts[i].x, pts[i+1].y - pts[i].y);
            let bestD = 1e9, bestT = 0, acc = 0;
            for (let i = 0; i < pts.length - 1; i++) {
                const a = pts[i], b = pts[i+1];
                const dx = b.x - a.x, dy = b.y - a.y;
                const len = Math.hypot(dx, dy) || 1;
                let u = ((x - a.x) * dx + (y - a.y) * dy) / (len * len);
                u = Math.max(0, Math.min(1, u));
                const px = a.x + dx * u, py = a.y + dy * u;
                const d = Math.hypot(x - px, y - py);
                if (d < bestD) { bestD = d; bestT = (acc + len * u) / total; }
                acc += len;
            }
            return { d: bestD, t: bestT };
        }
        // 区域等级：大世界=同心正方形环(每级只存在一个、区域是正方形)；地图=带地形的等级带(边界不规则)
        function regionRarityFor(wx, wy){
            const def = getMapDef();
            if (def.mode === MODE_TRAINING) return 0;
            // 大世界=最初最初的地图：等级按 x 分列(越往右越高)，和原版一致
            if (def.mode === MODE_WORLD) return Math.max(0, Math.min(MAX_MAP_RARITY, Math.floor(wx / REGION_SIZE)));
            // 地图：沿主路走向深处等级越高；路两侧是低等级区域；远离路也偏低
            const ri = roadInfoAt(def, wx, wy);
            const rl = roomLevelAt(wx, wy);   // 房室内部=高等级区域
            if (ri.d <= ROAD_HALF) {
                const roadLv = Math.floor(ri.t * (MAX_MAP_RARITY + 0.999));   // 路尽头=终末
                return Math.max(rl, Math.max(0, Math.min(MAX_MAP_RARITY, roadLv)));
            }
            if (ri.d <= ROAD_HALF * 2.6) {
                return Math.max(rl, Math.min(2, Math.floor(ri.t * 3)));       // 路旁：低等级区域
            }
            const cheb = Math.max(Math.abs(wx), Math.abs(wy));
            const n = (valueNoise(wx, wy, 2600, 11) - 0.5) * 2 * (REGION_SIZE * 0.55);
            const lv = Math.max(0, Math.min(3, Math.floor((cheb + n) / REGION_SIZE)));
            return Math.max(rl, lv);
        }
        // ---- 自然地形：多倍频噪声长出的连续墙体 ----
        const ROOM_CELL = 3600;      // 房室的分布间距
        function wallFieldValue(x, y){
            // 更低频的噪声 → 成片连成整块，不是零散小点
            const n1 = valueNoise(x, y, 2100, 71);
            const n2 = valueNoise(x, y, 820, 72);
            const n3 = valueNoise(x, y, 320, 73);
            return n1 * 0.64 + n2 * 0.26 + n3 * 0.10;
        }
        // 房室(box)：矩形房间 + 墙厚 + 每面留门洞 + 内部偶尔有隔断，位置/大小/门位由哈希决定
        function roomDef(ix, iy){
            const msh = noiseSeedOf(getMapDef().id) % 7000;   // 每张地图的房室布局不同(只改哈希种子，位置仍在网格上)
            const h0 = hash2(ix, iy, 301 + msh);
            if (h0 > 0.42) return null;
            const cx = (ix + 0.5) * ROOM_CELL + (hash2(ix, iy, 302) - 0.5) * 1000;
            const cy = (iy + 0.5) * ROOM_CELL + (hash2(ix, iy, 303) - 0.5) * 1000;
            const rw = 900 + hash2(ix, iy, 304) * 1500;
            const rh = 900 + hash2(ix, iy, 305) * 1500;
            const wallW = TERRAIN_TILE * (1 + Math.floor(hash2(ix, iy, 306) * 2));
            // 房室：由自然墙体围成、只留一个出口，内部大概率是高等级区域
            return { cx: cx, cy: cy, rw: rw, rh: rh, wall: wallW,
                     hw: rw / 2 + wallW, hh: rh / 2 + wallW,
                     exitSide: Math.floor(hash2(ix, iy, 312) * 4),          // 0上 1右 2下 3左
                     exitPos: (hash2(ix, iy, 313) - 0.5),
                     level: Math.min(MAX_MAP_RARITY, 7 + Math.floor(hash2(ix, iy, 314) * 4)),
                     seed: (ix * 73856093 ^ iy * 19349663) | 0 };
        }
        function roomWallAt(x, y){
            const ix0 = Math.floor(x / ROOM_CELL), iy0 = Math.floor(y / ROOM_CELL);
            for (let ix = ix0 - 1; ix <= ix0 + 1; ix++) {
                for (let iy = iy0 - 1; iy <= iy0 + 1; iy++) {
                    const r = roomDef(ix, iy); if (!r) continue;
                    const dx = x - r.cx, dy = y - r.cy;
                    if (Math.abs(dx) > r.hw + 200 || Math.abs(dy) > r.hh + 200) continue;
                    // 墙线用噪声起伏 → 围成自然形状，不是方盒子
                    const wob = (valueNoise(x, y, 300, 401) - 0.5) * 220;
                    const inX = Math.abs(dx) + wob <= r.rw / 2, inY = Math.abs(dy) + wob <= r.rh / 2;
                    if (inX && inY) {
                        return false;   // 房室内部保持空旷(以前这里会撒零散小石块)
                    }
                    // 只留一个出口
                    const doorHalf = TERRAIN_TILE * 1.4;
                    if (r.exitSide === 0 && !inY && dy < 0 && Math.abs(dx - r.exitPos * r.rw * 0.6) < doorHalf) return false;
                    if (r.exitSide === 2 && !inY && dy > 0 && Math.abs(dx - r.exitPos * r.rw * 0.6) < doorHalf) return false;
                    if (r.exitSide === 1 && !inX && dx > 0 && Math.abs(dy - r.exitPos * r.rh * 0.6) < doorHalf) return false;
                    if (r.exitSide === 3 && !inX && dx < 0 && Math.abs(dy - r.exitPos * r.rh * 0.6) < doorHalf) return false;
                    return true;
                }
            }
            return false;
        }
        // 房室内部等级(高等级区域)
        function roomLevelAt(x, y){
            const ix0 = Math.floor(x / ROOM_CELL), iy0 = Math.floor(y / ROOM_CELL);
            for (let ix = ix0 - 1; ix <= ix0 + 1; ix++) {
                for (let iy = iy0 - 1; iy <= iy0 + 1; iy++) {
                    const r = roomDef(ix, iy); if (!r) continue;
                    if (Math.abs(x - r.cx) < r.rw / 2 - TERRAIN_TILE && Math.abs(y - r.cy) < r.rh / 2 - TERRAIN_TILE) return r.level;
                }
            }
            return 0;
        }
        // 墙/房室：噪声阈值长出连续墙体(越深墙略多) + 房室墙
        // 未做连通性过滤的原始判定(房室墙 + 噪声墙)
        function terrainSolidRaw(tx, ty){
            const def = getMapDef();
            if (def.mode !== MODE_MAP) return false;
            const cx = (tx + 0.5) * TERRAIN_TILE, cy = (ty + 0.5) * TERRAIN_TILE;
            if (Math.hypot(cx, cy) < 1200) return false;                       // 出生点周围留空
            const edge = getMapHalf() - WALL_T - TERRAIN_TILE * 1.6;
            if (Math.abs(cx) > edge || Math.abs(cy) > edge) return false;
            // 主路由两侧的墙"卡"出来：路面留空，靠路边的两条墙带夹着一条大路
            const ri = roadInfoAt(def, cx, cy);
            if (ri.d < ROAD_HALF) return false;                                  // 路面：空
            const wallInner = ROAD_HALF + (valueNoise(cx, cy, 700, 61) - 0.5) * 240;   // 墙内缘起伏
            if (ri.d < wallInner + ROAD_WALL_T) {
                // 偶尔留缺口(门)，方便进出主路
                if (hash2(Math.round(cx / 420), Math.round(cy / 420), 63) < 0.12) return false;
                return true;
            }
            if (roomWallAt(cx, cy)) return true;                               // 房室墙
            if (valueNoise(cx, cy, 7200, 91) > 0.53) return false;             // 大片无墙区域
            const rarity = regionRarityFor(cx, cy);
            return wallFieldValue(cx, cy) > (0.70 - Math.min(0.04, rarity * 0.004));
        }
        // 最终判定：墙要连成片，去掉零散孤块(4邻域至少2个实心)
        function terrainSolidTile(tx, ty){
            const def = getMapDef();
            if (def.mode !== MODE_MAP) return false;   // 大世界=最初的地图(没有地形墙)；训练场=空地
            // 自定义地图(地图绘制器)：墙体完全按画好的来，不用程序生成的地形
            if (def.solidCells) return def.solidCells.has(tx + ',' + ty);
            const cx = (tx + 0.5) * TERRAIN_TILE, cy = (ty + 0.5) * TERRAIN_TILE;
            if (roadInfoAt(def, cx, cy).d < ROAD_HALF + TERRAIN_TILE) return false;   // 主路上不放任何墙
            if (roomWallAt(cx, cy)) return true;       // 房室墙永远保留
            if (!terrainSolidRaw(tx, ty)) return false;
            let n = 0;
            if (terrainSolidRaw(tx + 1, ty)) n++;
            if (terrainSolidRaw(tx - 1, ty)) n++;
            if (terrainSolidRaw(tx, ty + 1)) n++;
            if (terrainSolidRaw(tx, ty - 1)) n++;
            return n >= 2;
        }
        function collideWithTerrain(ent, isPlayer){
            return collideWithTerrainRaw(ent, isPlayer);
        }
        // 分步移动：速度再快也不会一步跨过墙
        function monsterMoveBy(m, dx, dy){
            let dist = Math.hypot(dx, dy);
            const maxMove = 3000;   // 单帧最大位移：被爆炸推得再远也不会跳过墙
            if (dist > maxMove) { const k = maxMove / dist; dx *= k; dy *= k; dist = maxMove; }
            const maxStep = Math.max(40, Math.min(110, (m.radius || 20) * 0.55));
            const steps = Math.max(1, Math.ceil(dist / maxStep));
            for (let i = 0; i < steps; i++) {
                m.x += dx / steps; m.y += dy / steps;
                collideWithTerrainRaw(m, false);
            }
        }
        function moveEntityWithCollision(ent, dx, dy, isPlayer){
            let dist = Math.hypot(dx, dy);
            const maxMove = 3000;   // 单帧最大位移：极端速度也不会一步跳过墙
            if (dist > maxMove) { const k = maxMove / dist; dx *= k; dy *= k; dist = maxMove; }
            const maxStep = Math.max(20, Math.min(48, (ent.radius || 20) * 0.9));
            const steps = Math.max(1, Math.ceil(dist / maxStep));
            const sx = dx / steps, sy = dy / steps;
            for (let i = 0; i < steps; i++) {
                ent.x += sx; ent.y += sy;
                collideWithTerrainRaw(ent, isPlayer);
            }
        }
        function collideWithTerrainRaw(ent, isPlayer){
            const r = ent.radius || 0;
            const half = getMapHalf() - WALL_T - r;
            let hit = false;
            if (ent.x > half) { ent.x = half; hit = true; }
            if (ent.x < -half) { ent.x = -half; hit = true; }
            if (ent.y > half) { ent.y = half; hit = true; }
            if (ent.y < -half) { ent.y = -half; hit = true; }
            const tx0 = Math.floor((ent.x - r) / TERRAIN_TILE), tx1 = Math.floor((ent.x + r) / TERRAIN_TILE);
            const ty0 = Math.floor((ent.y - r) / TERRAIN_TILE), ty1 = Math.floor((ent.y + r) / TERRAIN_TILE);
            for (let tx = tx0; tx <= tx1; tx++) {
                for (let ty = ty0; ty <= ty1; ty++) {
                    if (!terrainSolidTile(tx, ty)) continue;
                    const bx = tx * TERRAIN_TILE, by = ty * TERRAIN_TILE;
                    const cx = Math.max(bx, Math.min(ent.x, bx + TERRAIN_TILE));
                    const cy = Math.max(by, Math.min(ent.y, by + TERRAIN_TILE));
                    const dx = ent.x - cx, dy = ent.y - cy;
                    const d = Math.hypot(dx, dy);
                    if (d < r) {
                        hit = true;
                        if (d > 0.001) { const push = r - d; ent.x += dx / d * push; ent.y += dy / d * push; }
                        else {
                            // 圆心落在方块内(高速贴着墙走会出现)：按最小穿透方向推出，避免被"推穿"墙
                            const outL = ent.x + r - bx, outR = (bx + TERRAIN_TILE) - ent.x + r;
                            const outT = ent.y + r - by, outB = (by + TERRAIN_TILE) - ent.y + r;
                            const mn = Math.min(outL, outR, outT, outB);
                            if (mn === outL) ent.x = bx - r;
                            else if (mn === outR) ent.x = bx + TERRAIN_TILE + r;
                            else if (mn === outT) ent.y = by - r;
                            else ent.y = by + TERRAIN_TILE + r;
                        }
                    }
                }
            }
            if (hit) {  // 墙体摩擦
                if (isPlayer) { playerKX *= 0.5; playerKY *= 0.5; }
                else { if (ent.pushVX !== undefined) { ent.pushVX *= 0.55; ent.pushVY *= 0.55; } if (ent.vx !== undefined) { ent.vx *= 0.55; ent.vy *= 0.55; } }
            }
            return hit;
        }
        // ---- 地图状态保存/恢复(重复进入同一张图可以继续捡地上的花瓣) ----
        function ensureMapState(id){
            if (!mapStates[id]) {
                // 自定义地图可以设置出生点；其它地图还是从 (0,0) 开始
                const sp = (MAP_DEFS[id] && MAP_DEFS[id].spawnPoint) || { x: 0, y: 0 };
                mapStates[id] = { drops: [], monsters: [], beeMissiles: [], playerX: sp.x, playerY: sp.y,

            }
            return mapStates[id];
        }
        function saveMapState(){
            const st = ensureMapState(currentMapId);
            st.drops = drops; st.monsters = monsters; st.beeMissiles = beeMissiles;
            st.playerX = playerX; st.playerY = playerY; st.corpse = corpse;
        }
        function applyMapState(id){
            const st = ensureMapState(id);
            drops = st.drops; monsters = st.monsters; beeMissiles = st.beeMissiles;
            // 第一次进这张图：站到地图作者摆的出生点(没摆就用正中心)；之后再进图沿用上次离开的位置
            if (!st.visited){
                const sp = (MAP_DEFS[id] && MAP_DEFS[id].spawnPoint);
                if (sp){ st.playerX = sp.x; st.playerY = sp.y; }
                st.visited = true;

        // 训练场：把训练假人摆进有限正方形场地(不刷怪)
        function buildTrainingDummies(){
            const out = [];
            const cols = 4, rows = 3;
            for (let r = 0; r < 12; r++) {
                const cx = (r % cols) - (cols - 1) / 2;
                const cy = Math.floor(r / cols) - (rows - 1) / 2;
                out.push(new TrainingDummy(cx * 620, cy * 620, r));
            }
            return out;
        }
        // ---- 模式/地图切换 ----

            else { gameMode = MODE_MAP; currentMapId = (MAP_DEFS[mapId] ? mapId : 'garden'); }
            { const d0 = MAP_DEFS[currentMapId]; if (d0 && d0.mode !== undefined) gameMode = d0.mode; }   // 自定义图代替原图时按图自己的模式

            const kb = document.getElementById('killBtn'); if (kb) kb.classList.add('show');
            const tag = document.getElementById('mapTag');
            if (tag) { tag.textContent = getMapDef().name + (getMapDef().magicOnly ? '(只有魔法变种)' : ''); tag.classList.add('show'); }
            dummies = inTraining() ? buildTrainingDummies() : [];
            if (inTraining()) { monsters = []; beeMissiles = []; }
            toast('进入 ' + getMapDef().name);
        }
        function hideAllMenuUI(){
            const mm = document.getElementById('mainMenu'); if (mm) mm.classList.remove('show');
            const ov = document.getElementById('deathOverlay'); if (ov) ov.classList.remove('show');
            const lo = document.getElementById('deathLoot'); if (lo) lo.classList.remove('show');
            const dt = document.getElementById('deathTitle'); if (dt) dt.classList.remove('show');

        // ---- 主菜单 ----
        function setupMainMenu(){
            const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
            bind('menuBtnWorld', () => { menuPick = { kind:'world', mapId:'world' }; menuLevel = 2; refreshMenu(); });
            bind('menuBtnMaps', () => { menuLevel = 1; if (!menuPick || menuPick.kind !== 'map') menuPick = { kind:'map', mapId:'garden' }; refreshMenu(); });
            bind('menuBtnTraining', () => { menuPick = { kind:'training', mapId:'training' }; menuLevel = 2; refreshMenu(); });

        function refreshMenu(){

        // ---- 背景/地形绘制 ----
        let menuTime = 0;
        function updateMenuBgClock(dt){ menuTime += dt; }
        function viewWorldRect(w, h){
            const hw = (w / 2) / Math.max(0.0001, viewScale), hh = (h / 2) / Math.max(0.0001, viewScale);
            return { left: cameraX - hw, right: cameraX + hw, top: cameraY - hh, bottom: cameraY + hh };
        }
        // 每种地面类型对应的底色(自定义地图可以在同一张图上混用多种地面)
        const GROUND_STYLE = {
            plain:  { ground: '#ffffff', groundAlt: '#f7f9f4' },
            garden: { ground: '#8fd45f', groundAlt: '#7ec850' },
            desert: { ground: '#e8d49b', groundAlt: '#dcc588' },
            ocean:  { ground: '#3a9ad9', groundAlt: '#2f86c4' },
            jungle: { ground: '#4f9b3a', groundAlt: '#438a31' },
            bio:    { ground: '#c98d7a', groundAlt: '#b87f6d' }
        };
        // 某一格实际用哪种地面(自定义地图可以在同一张图上混用多种地面)
        function groundKindAt(kind, tx, ty, def){
            if (!def) def = getMapDef();
            const ov = def.groundCells && def.groundCells.get(tx + ',' + ty);
            return ov || kind;
        }
        function drawGroundTile(kind, sx, sy, size, tx, ty, def){
            kind = groundKindAt(kind, tx, ty, def);   // 自定义地图：这一格可能被画成别的地面类型
            const st = GROUND_STYLE[kind] || def;
            // 地面底色用噪声过渡(不是硬碰硬的格子)，看起来更自然
            const nv = valueNoise((tx + 0.5) * size, (ty + 0.5) * size, 620, 21);
            ctx.fillStyle = (nv > 0.54) ? st.groundAlt : st.ground;
            ctx.fillRect(sx, sy, size + 0.7, size + 0.7);
            if (kind === 'plain') return;
            const h2 = hash2(tx, ty, 31), h3 = hash2(tx, ty, 41);
            if (kind === 'garden' || kind === 'jungle') {
                ctx.strokeStyle = kind === 'jungle' ? 'rgba(20,60,20,0.35)' : 'rgba(60,120,40,0.32)';
                ctx.lineWidth = 2;
                const n = kind === 'jungle' ? 9 : 6;
                for (let i = 0; i < n; i++) {
                    const gx = sx + 12 + hash2(tx * 13 + i, ty, 51) * (size - 24);
                    const gy = sy + 12 + hash2(tx, ty * 17 + i, 61) * (size - 24);
                    ctx.beginPath(); ctx.moveTo(gx, gy);
                    ctx.quadraticCurveTo(gx + 3, gy - 9, gx + (i % 2 ? 8 : -8), gy - 16);
                    ctx.stroke();
                }
                if (kind === 'garden' && h2 > 0.72) {
                    ctx.fillStyle = ['#f5f57a','#f7a6c8','#ffffff'][Math.floor(h3 * 3)];
                    for (let i = 0; i < 3; i++) {
                        const fx = sx + 20 + hash2(tx + i, ty * 7, 71) * (size - 40);
                        const fy = sy + 20 + hash2(tx * 5, ty + i, 81) * (size - 40);
                        ctx.beginPath(); ctx.arc(fx, fy, 4, 0, Math.PI * 2); ctx.fill();
                    }
                }
            } else if (kind === 'desert') {
                ctx.strokeStyle = 'rgba(160,130,70,0.35)'; ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const gy = sy + 26 + i * (size / 6);
                    ctx.beginPath();
                    for (let x = sx; x <= sx + size; x += 18) ctx.lineTo(x, gy + Math.sin(x / 40 + i) * 3);
                    ctx.stroke();
                }
                if (h3 > 0.6) { ctx.fillStyle = '#c9a86a'; ctx.fillRect(sx + 20 + h2 * (size - 70), sy + 24 + h3 * (size - 70), 46, 34); }
            } else if (kind === 'ocean') {
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
                for (let i = 0; i < 4; i++) {
                    const gy = sy + 24 + i * (size / 4.5);
                    ctx.beginPath();
                    for (let x = sx; x <= sx + size; x += 16) ctx.lineTo(x, gy + Math.sin((x + tx * 30) / 30 + menuTime * 1.1 + i) * 4);
                    ctx.stroke();
                }
                if (h2 > 0.86) { ctx.fillStyle = '#ef7fa8'; ctx.beginPath(); ctx.arc(sx + size / 2, sy + size / 2, 13, 0, Math.PI * 2); ctx.fill(); }
            } else if (kind === 'bio') {
                ctx.strokeStyle = 'rgba(120,50,50,0.28)'; ctx.lineWidth = 3;
                for (let i = 0; i < 5; i++) {
                    const gy = sy + 22 + i * (size / 5.5);
                    ctx.beginPath();
                    for (let x = sx; x <= sx + size; x += 18) ctx.lineTo(x, gy + Math.sin(x / 26 + i * 1.6) * 6);
                    ctx.stroke();
                }
                if (h3 > 0.8) { ctx.fillStyle = 'rgba(140,60,60,0.5)'; ctx.beginPath(); ctx.arc(sx + size / 2, sy + size / 2, 16, 0, Math.PI * 2); ctx.fill(); }
            }

        function drawWallBlock(sx, sy, size, def, tx, ty, isBorder){
            const c = def.wall[Math.floor(hash2(tx, ty, 91) * def.wall.length) % def.wall.length];
            const grow = isBorder ? 0 : (hash2(tx, ty, 101) * 6);
            const x = sx - grow, y = sy - grow, s = size + grow * 2;
            ctx.fillStyle = c;
            ctx.fillRect(x, y, s, s);
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.fillRect(x, y, s, Math.max(4, s * 0.16));
            ctx.fillStyle = 'rgba(0,0,0,0.22)';
            ctx.fillRect(x, y + s * 0.84, s, Math.max(4, s * 0.16));
            // 突起
            const n = 2 + Math.floor(hash2(tx, ty, 111) * 3);
            for (let i = 0; i < n; i++) {
                const px = x + hash2(tx * 7 + i, ty, 121) * s, py = y + hash2(tx, ty * 11 + i, 131) * s;
                const pr = 5 + hash2(tx + i, ty + i, 141) * 9;
                ctx.fillStyle = def.wall[(Math.floor(hash2(tx + i, ty, 151) * def.wall.length)) % def.wall.length];
                ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
            }
        }
        function drawBorderWalls(w, h, def){
            const half = getMapHalf();
            const vr = viewWorldRect(w, h);
            const step = TERRAIN_TILE;
            const lo = -half, hi = half;
            const seg = (x0, y0, isHoriz) => {
                // 沿着一条边铺墙块
                const n = Math.ceil((hi - lo) / step);
                for (let i = 0; i < n; i++) {
                    const a = lo + i * step;
                    const bx = isHoriz ? a : x0, by = isHoriz ? y0 : a;
                    if (bx + step < vr.left || bx > vr.right || by + step < vr.top || by > vr.bottom) continue;
                    const s = worldToScreen(bx, by);
                    const tx = Math.round(bx / step), ty = Math.round(by / step);
                    drawWallBlock(s.x, s.y, step, def, tx, ty + 900, true);
                }
            };
            seg(-half, -half, true);              // 上
            seg(-half, half - WALL_T + (WALL_T % step), true);  // 下
            seg(-half, -half, false);             // 左
            seg(half - WALL_T + (WALL_T % step), -half, false); // 右
            // 地图外由 drawOutsideMask 统一画深色(这里不再自己填，否则左/上边会把填色画进地图里盖住墙)
        }
        function drawRegionLines(w, h){
            const def = getMapDef();
            const vr = viewWorldRect(w, h);
            if (def.mode === MODE_WORLD) {
                // 最初最初的地图：等级区带是竖直的，每 REGION_SIZE 一条分界线(和原版一样)
                const startCol = Math.floor(vr.left / REGION_SIZE), endCol = Math.floor(vr.right / REGION_SIZE);
                ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 2;
                for (let col = startCol; col <= endCol; col++) {
                    const x = col * REGION_SIZE, sx = worldToScreen(x, 0).x;
                    if (sx < 0 || sx > w) continue;
                    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, h); ctx.stroke();
                }
                return;
            }
            if (def.mode !== MODE_MAP) return;   // 其它地图是地形化等级带，不画规则线
            const maxR = Math.min(MAX_MAP_RARITY, Math.ceil(Math.max(Math.abs(vr.left), Math.abs(vr.right), Math.abs(vr.top), Math.abs(vr.bottom)) / REGION_SIZE));
            ctx.strokeStyle = 'rgba(0,0,0,0.16)'; ctx.lineWidth = 2; ctx.setLineDash([14, 10]);
            for (let r = 1; r <= maxR + 1; r++) {
                const d = r * REGION_SIZE;
                const a = worldToScreen(-d, -d), b = worldToScreen(d, d);

            ctx.setLineDash([]);
        }
        function drawTerrainBackground(w, h){
            const def = getMapDef();
            const vr = viewWorldRect(w, h);
            const size = TERRAIN_TILE;
            const tx0 = Math.floor(vr.left / size), tx1 = Math.floor(vr.right / size);
            const ty0 = Math.floor(vr.top / size), ty1 = Math.floor(vr.bottom / size);
            for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
                const s = worldToScreen(tx * size, ty * size);
                drawGroundTile(def.groundKind, s.x, s.y, size, tx, ty, def);
            }
            if (def.mode === MODE_MAP && !def.authored) { drawRoad(vr, def); drawRoomFloors(vr, def); }   // 主路 + 房室地面(自定义地图没有这些)
            if (def.mode === MODE_WORLD) drawGrid(w, h);          // 大世界=最初的地图(网格)
            drawRegionLines(w, h);
            drawTerrainWalls(w, h, def);
            drawBorderWalls(w, h, def);
            drawOutsideMask(w, h);

        // 地图之外的区域不画地面：直接盖深色，地图边界一目了然(不会显得无限大)
        function drawOutsideMask(w, h){
            const half = getMapHalf();
            const vr = viewWorldRect(w, h);
            if (vr.left >= -half && vr.right <= half && vr.top >= -half && vr.bottom <= half) return;
            ctx.fillStyle = '#171b20';
            const a = worldToScreen(vr.left, vr.top);
            const bw = (vr.right - vr.left), bh = (vr.bottom - vr.top);
            if (vr.top < -half) ctx.fillRect(a.x, a.y, bw, Math.min(bh, (-half - vr.top)));
            if (vr.bottom > half) ctx.fillRect(a.x, a.y + (bh - Math.min(bh, (vr.bottom - half))), bw, Math.min(bh, (vr.bottom - half)));
            if (vr.left < -half) ctx.fillRect(a.x, a.y, Math.min(bw, (-half - vr.left)), bh);
            if (vr.right > half) ctx.fillRect(a.x + (bw - Math.min(bw, (vr.right - half))), a.y, Math.min(bw, (vr.right - half)), bh);
        }
        // 房室地面：铺一块略亮的地面，方便辨认"高等级房室"
        // 主路：一条很宽的蜿蜒路面，越往深处等级越高
        function drawRoad(vr, def){
            const pts = roadPathFor(def);
            if (!pts || pts.length < 2) return;
            const col = def.road || def.groundAlt;
            ctx.save();
            ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.lineWidth = ROAD_HALF * 2 + 60;
            ctx.strokeStyle = 'rgba(0,0,0,0.22)';
            ctx.beginPath();
            let started = false;
            for (const p of pts) {
                const s = worldToScreen(p.x, p.y);
                if (!started) { ctx.moveTo(s.x, s.y); started = true; } else ctx.lineTo(s.x, s.y);
            }
            ctx.stroke();
            ctx.lineWidth = ROAD_HALF * 2;
            ctx.strokeStyle = col;
            ctx.stroke();
            ctx.restore();
        }
        function drawRoomFloors(vr, def){
            const ix0 = Math.floor(vr.left / ROOM_CELL) - 1, ix1 = Math.floor(vr.right / ROOM_CELL) + 1;
            const iy0 = Math.floor(vr.top / ROOM_CELL) - 1, iy1 = Math.floor(vr.bottom / ROOM_CELL) + 1;
            for (let ix = ix0; ix <= ix1; ix++) for (let iy = iy0; iy <= iy1; iy++) {
                const r = roomDef(ix, iy); if (!r) continue;
                if (r.cx - r.rw > vr.right || r.cx + r.rw < vr.left || r.cy - r.rh > vr.bottom || r.cy + r.rh < vr.top) continue;
                const c = worldToScreen(r.cx, r.cy);

        }
        // 自然墙体：相邻实心格融合成连续形状(圆+连接)，再描一圈圆头轮廓和小凸起
        // ===== 障碍(墙)的样子：碰撞全都是实心，只是外观不同 =====
        const OBSTACLE_TYPES = { wall:'墙体', tree:'树', rock:'石头', fence:'栅栏', crystal:'水晶' };
        function obstacleTypeAt(def, tx, ty){
            const m = def && def.wallTypes;
            return (m && m.get(tx + ',' + ty)) || 'wall';
        }
        function obstacleLabelOf(t){ return OBSTACLE_TYPES[t] || t || '墙体'; }
        function drawObstacleType(type, s, size, tx, ty){
            const cx = s.x + size / 2, cy = s.y + size / 2, r = size * 0.46;
            ctx.save();
            if (type === 'tree'){
                ctx.fillStyle = '#6b4a25';
                ctx.fillRect(cx - size * 0.07, cy + r * 0.1, size * 0.14, r * 0.8);
                ctx.beginPath(); ctx.arc(cx, cy - r * 0.3, r * 0.7, 0, Math.PI * 2); ctx.fillStyle = '#2f7a34'; ctx.fill();
                ctx.beginPath(); ctx.arc(cx - r * 0.42, cy - r * 0.05, r * 0.48, 0, Math.PI * 2); ctx.fillStyle = '#3d9440'; ctx.fill();
                ctx.beginPath(); ctx.arc(cx + r * 0.42, cy - r * 0.05, r * 0.48, 0, Math.PI * 2); ctx.fillStyle = '#276b2c'; ctx.fill();
                ctx.beginPath(); ctx.arc(cx, cy - r * 0.35, r * 0.7, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3; ctx.stroke();
            } else if (type === 'rock'){
                ctx.beginPath();
                const n = 7;
                for (let i = 0; i < n; i++){
                    const a = i / n * Math.PI * 2 + hash2(tx, ty, 411) * 6;
                    const rr = r * (0.7 + hash2(tx * 3 + i, ty, 412) * 0.3);
                    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * 0.86;
                    ctx[i ? 'lineTo' : 'moveTo'](px, py);
                }
                ctx.closePath();
                ctx.fillStyle = '#9aa0a8'; ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 3; ctx.stroke();
                ctx.beginPath(); ctx.arc(cx - r * 0.22, cy - r * 0.24, r * 0.28, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
            } else if (type === 'fence'){
                ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = Math.max(3, size * 0.07); ctx.lineCap = 'round';
                for (let i = 0; i < 3; i++){
                    const yy = s.y + size * (0.3 + i * 0.2);
                    ctx.beginPath(); ctx.moveTo(s.x + size * 0.08, yy); ctx.lineTo(s.x + size * 0.92, yy); ctx.stroke();
                }
                ctx.beginPath(); ctx.moveTo(s.x + size * 0.22, s.y + size * 0.16); ctx.lineTo(s.x + size * 0.22, s.y + size * 0.84); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(s.x + size * 0.78, s.y + size * 0.16); ctx.lineTo(s.x + size * 0.78, s.y + size * 0.84); ctx.stroke();
            } else if (type === 'crystal'){
                ctx.beginPath();
                ctx.moveTo(cx, cy - r * 0.9); ctx.lineTo(cx + r * 0.55, cy); ctx.lineTo(cx, cy + r * 0.9); ctx.lineTo(cx - r * 0.55, cy);
                ctx.closePath();
                ctx.fillStyle = '#7de3ff'; ctx.fill();
                ctx.strokeStyle = 'rgba(20,60,90,0.6)'; ctx.lineWidth = 3; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(cx, cy - r * 0.9); ctx.lineTo(cx, cy + r * 0.9);
                ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.stroke();
            }
            ctx.restore();
        }
        function drawTerrainWalls(w, h, def){
            const size = TERRAIN_TILE;
            const vr = viewWorldRect(w, h);
            const tx0 = Math.floor(vr.left / size) - 2, tx1 = Math.floor(vr.right / size) + 2;
            const ty0 = Math.floor(vr.top / size) - 2, ty1 = Math.floor(vr.bottom / size) + 2;
            const solid = (tx, ty) => terrainSolidTile(tx, ty);
            // 画了类型的障碍(树/石头/栅栏/水晶)不参与"墙块连体"绘制，单独一个形状
            const isPlainWall = (tx, ty) => solid(tx, ty) && obstacleTypeAt(def, tx, ty) === 'wall';
            const body = def.wall[Math.min(1, def.wall.length - 1)];
            const rim = def.wall[def.wall.length - 1];
            const r = size * 0.56;
            ctx.fillStyle = body;
            for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
                if (!isPlainWall(tx, ty)) continue;
                const s = worldToScreen(tx * size, ty * size);
                const cx = s.x + size / 2, cy = s.y + size / 2;
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                if (isPlainWall(tx + 1, ty)) ctx.fillRect(cx, cy - r, size / 2 + 1, r * 2);
                if (isPlainWall(tx - 1, ty)) ctx.fillRect(cx - size / 2 - 1, cy - r, size / 2 + 1, r * 2);
                if (isPlainWall(tx, ty + 1)) ctx.fillRect(cx - r, cy, r * 2, size / 2 + 1);
                if (isPlainWall(tx, ty - 1)) ctx.fillRect(cx - r, cy - size / 2 - 1, r * 2, size / 2 + 1);
            }
            // 轮廓：只画与空地相邻的那条边
            ctx.strokeStyle = rim; ctx.lineWidth = 7; ctx.lineCap = 'round';
            for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
                if (!isPlainWall(tx, ty)) continue;
                const s = worldToScreen(tx * size, ty * size);
                const x0 = s.x, y0 = s.y, x1 = s.x + size, y1 = s.y + size;
                const i = 5;
                if (!isPlainWall(tx, ty - 1)) { ctx.beginPath(); ctx.moveTo(x0 + i, y0 + i); ctx.lineTo(x1 - i, y0 + i); ctx.stroke(); }
                if (!isPlainWall(tx, ty + 1)) { ctx.beginPath(); ctx.moveTo(x0 + i, y1 - i); ctx.lineTo(x1 - i, y1 - i); ctx.stroke(); }
                if (!isPlainWall(tx - 1, ty)) { ctx.beginPath(); ctx.moveTo(x0 + i, y0 + i); ctx.lineTo(x0 + i, y1 - i); ctx.stroke(); }
                if (!isPlainWall(tx + 1, ty)) { ctx.beginPath(); ctx.moveTo(x1 - i, y0 + i); ctx.lineTo(x1 - i, y1 - i); ctx.stroke(); }
            }
            // 凸起：随机小圆，让墙面有起伏
            for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
                if (!isPlainWall(tx, ty)) continue;
                if (hash2(tx, ty, 331) < 0.55) continue;
                const s = worldToScreen(tx * size, ty * size);
                const cx = s.x + size * (0.25 + hash2(tx, ty, 332) * 0.5);
                const cy = s.y + size * (0.25 + hash2(tx, ty, 333) * 0.5);
                const rr = size * (0.12 + hash2(tx, ty, 334) * 0.1);
                ctx.fillStyle = def.wall[Math.floor(hash2(tx, ty, 335) * def.wall.length) % def.wall.length];
                ctx.beginPath(); ctx.arc(cx, cy, rr, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.22)'; ctx.lineWidth = 2; ctx.stroke();
            }
            // 画过样式的障碍：树 / 石头 / 栅栏 / 水晶(碰撞和墙一样是实心，只是长得不一样)
            for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
                if (!solid(tx, ty)) continue;
                const t = obstacleTypeAt(def, tx, ty);
                if (t === 'wall') continue;
                drawObstacleType(t, worldToScreen(tx * size, ty * size), size, tx, ty);
            }
        }
        function drawCorpse(){
            if (!corpse) return;
            const s = worldToScreen(corpse.x, corpse.y);
            const r = getPlayerRadius();
            ctx.save(); ctx.globalAlpha = 0.65;
            ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
            ctx.fillStyle = '#9a9a9a'; ctx.fill();
            ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = '#6f6f6f';
            for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5; ctx.beginPath(); ctx.arc(s.x + Math.cos(a) * r * 0.6, s.y + Math.sin(a) * r * 0.6, r * 0.34, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
        }
        // ---- 小地图(白地黑墙，不显示生物；M 键 x1.5 展开) ----
        // 整张地图的小地图底图(白地黑墙)，每张地图只生成一次
        const minimapBitmaps = {};
        function getMapBitmap(def){
            if (minimapBitmaps[def.id]) return minimapBitmaps[def.id];
            const N = 110;
            const cnv = document.createElement('canvas');
            cnv.width = N; cnv.height = N;
            const c = cnv.getContext('2d');
            c.fillStyle = '#ffffff'; c.fillRect(0, 0, N, N);
            if (def.mode === MODE_MAP) {
                c.fillStyle = '#000000';
                const half = def.size / 2, stepW = def.size / N;
                for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
                    const wx = -half + (i + 0.5) * stepW, wy = -half + (j + 0.5) * stepW;
                    if (terrainSolidTile(Math.floor(wx / TERRAIN_TILE), Math.floor(wy / TERRAIN_TILE))) c.fillRect(i, j, 1.5, 1.5);
                }
            }
            minimapBitmaps[def.id] = cnv;
            return cnv;
        }
        function drawMiniMapNew(){
            const w = container.clientWidth, h = container.clientHeight;
            const size = 150, margin = 12;
            const mapX = w - size - margin, mapY = margin;
            const half = getMapHalf();
            const range = 900 + (half * 1.03 - 900) * minimapZoom;   // 0=局部 → 1=整张地图
            const def = getMapDef();
            const scale = size / (range * 2);
            const ox = mapX + size / 2 - playerX * scale, oy = mapY + size / 2 - playerY * scale;
            ctx.save();
            ctx.fillStyle = '#fff'; ctx.fillRect(mapX, mapY, size, size);
            ctx.beginPath(); ctx.rect(mapX, mapY, size, size); ctx.clip();
            ctx.fillStyle = '#000';
            if (minimapZoom < 0.55) {
                // 局部：即时采样(黑墙)
                const step = Math.max(TERRAIN_TILE, range / 40);
                const x0 = Math.floor((playerX - range) / step) * step, y0 = Math.floor((playerY - range) / step) * step;
                for (let x = x0; x <= playerX + range; x += step) for (let y = y0; y <= playerY + range; y += step) {
                    if (!terrainSolidTile(Math.floor(x / TERRAIN_TILE), Math.floor(y / TERRAIN_TILE))) continue;
                    ctx.fillRect(x * scale + ox, y * scale + oy, step * scale + 0.7, step * scale + 0.7);
                }
            } else {
                // 整张地图：用缓存的整图底图(白地黑墙)
                const bmp = getMapBitmap(def);
                const bl = -half * scale + ox, bt = -half * scale + oy, bs = (half * 2) * scale;
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(bmp, bl, bt, bs, bs);
            }
            const sl = -half * scale + ox, st = -half * scale + oy, ss = (half * 2) * scale;
            ctx.fillRect(mapX, mapY, Math.max(0, Math.min(size, sl - mapX)), size);
            ctx.fillRect(Math.min(mapX + size, sl + ss), mapY, Math.max(0, (mapX + size) - (sl + ss)), size);
            ctx.fillRect(mapX, mapY, size, Math.max(0, Math.min(size, st - mapY)));
            ctx.fillRect(mapX, Math.min(mapY + size, st + ss), size, Math.max(0, (mapY + size) - (st + ss)));
            ctx.fillRect(sl, st, ss, Math.min(WALL_T * scale, 6));
            ctx.fillRect(sl, st + ss - Math.min(WALL_T * scale, 6), ss, Math.min(WALL_T * scale, 6));
            ctx.fillRect(sl, st, Math.min(WALL_T * scale, 6), ss);
            ctx.fillRect(sl + ss - Math.min(WALL_T * scale, 6), st, Math.min(WALL_T * scale, 6), ss);
            // 玩家
            const px = playerX * scale + ox, py = playerY * scale + oy;
            ctx.fillStyle = '#e33'; ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
            ctx.restore();
            ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(mapX, mapY, size, size);
            ctx.fillStyle = '#000'; ctx.font = 'bold 10px "Segoe UI"'; ctx.textAlign = 'left';
            ctx.fillText(def.name + (minimapZoom > 0.5 ? '(全图)' : ''), mapX + 3, mapY + size + 12);
        }
        // ==== 主菜单/地形系统：上半部分结束 ====
        init();
    })();
</script>
</body>
</html>
